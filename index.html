<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latihan Soal Substansial Tes Kepala Sekolah</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#1e2340;--mut:#6b7194;--bd:#e3e7f3;--pri:#5b5bf0;--pri2:#8b5cf6;--ok:#12a35f;--okbg:#e6f7ee;--no:#e5484d;--nobg:#fdecec;--warn:#f59e0b;--sh:0 8px 30px rgba(50,60,120,.10)}
[data-t=dark]{--bg:#0f1226;--card:#181c38;--tx:#e8eaff;--mut:#9aa0c8;--bd:#2a2f57;--okbg:#0e2e22;--nobg:#3a1a20;--sh:0 8px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.55;transition:background .3s}
header{background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5;box-shadow:0 4px 18px rgba(80,70,220,.35)}
.hin{max-width:900px;margin:auto;display:flex;align-items:center;gap:12px}
header h1{font-size:1.05rem;margin:0;flex:1;line-height:1.25}
header small{opacity:.85;font-weight:400;display:block;font-size:.75rem}
.ib{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:10px;padding:8px 11px;cursor:pointer;font-size:1rem}
.ib:hover{background:rgba(255,255,255,.32)}
main{max-width:900px;margin:22px auto;padding:0 14px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;box-shadow:var(--sh);animation:up .45s ease both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;font-size:1.25rem}
.sub{color:var(--mut);margin:0 0 18px;font-size:.92rem}
.lbl{font-weight:700;margin:20px 0 8px;font-size:.9rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:2px solid var(--bd);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;background:var(--card);color:var(--tx);text-align:left;font:inherit}
.mode:hover{transform:translateY(-3px);border-color:var(--pri)}
.mode.on{border-color:var(--pri);background:linear-gradient(135deg,rgba(91,91,240,.12),rgba(139,92,246,.12))}
.mode b{display:block;font-size:1.05rem}.mode span{font-size:.82rem;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--bd);border-radius:999px;padding:8px 14px;cursor:pointer;user-select:none;font-size:.9rem;transition:.2s;background:var(--card)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--bd)}
.row:last-of-type{border:0}
.sw{position:relative;width:46px;height:26px;flex:none}.sw input{display:none}
.sw i{position:absolute;inset:0;background:var(--bd);border-radius:99px;transition:.25s;cursor:pointer}
.sw i:after{content:"";position:absolute;width:20px;height:20px;top:3px;left:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--pri)}.sw input:checked+i:after{left:23px}
input[type=number]{width:84px;padding:8px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.btn{border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(120deg,var(--pri),var(--pri2));transition:.2s;box-shadow:0 6px 16px rgba(91,91,240,.35)}
.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.g{background:var(--card);color:var(--tx);border:2px solid var(--bd);box-shadow:none}
.btn.big{width:100%;margin-top:22px;padding:15px;font-size:1.05rem}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tag{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(91,91,240,.14);color:var(--pri)}
[data-t=dark] .tag{color:#b3b3ff}
.tm{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:16px}
.bar div{height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .4s}
.q{font-size:1.06rem;margin:6px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:13px 14px;margin-bottom:10px;cursor:pointer;font:inherit;transition:.18s}
.opt:hover:not(:disabled){border-color:var(--pri);transform:translateX(4px)}
.opt .l{flex:none;width:30px;height:30px;border-radius:9px;background:var(--bd);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.opt.sel{border-color:var(--pri);background:rgba(91,91,240,.09)}.opt.sel .l{background:var(--pri);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg);animation:pop .35s}.opt.ok .l{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nobg);animation:shake .4s}.opt.no .l{background:var(--no);color:#fff}
.opt:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.02)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:14px;border-radius:14px;padding:14px 16px;animation:up .35s both;border-left:6px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}.fb.no{background:var(--nobg);border-color:var(--no)}
.fb h4{margin:0 0 6px}.fb p{margin:4px 0;font-size:.93rem}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:7px;margin-top:16px}
.gn{aspect-ratio:1;border-radius:9px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;cursor:pointer;font-size:.85rem}
.gn.a{background:var(--pri);border-color:var(--pri);color:#fff}.gn.c{outline:3px solid var(--warn)}
.gn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.gn.no{background:var(--no);border-color:var(--no);color:#fff}
.ring{width:170px;height:170px;margin:6px auto;position:relative}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring .bg{stroke:var(--bd)}.ring .fg{stroke:url(#gr);stroke-dasharray:440;stroke-dashoffset:440;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.st{text-align:center;border-radius:14px;padding:12px;background:var(--bg)}.st b{display:block;font-size:1.5rem}.st span{font-size:.78rem;color:var(--mut)}
.cb{margin:10px 0}.cb .h{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:4px}
.rv{border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.rv .opt{cursor:default;padding:9px 12px;margin-bottom:6px;font-size:.92rem}
.modal{position:fixed;inset:0;background:rgba(10,12,30,.6);display:grid;place-items:center;z-index:20;padding:16px;animation:up .2s}
.modal .card{max-width:400px;text-align:center}
.hist{font-size:.85rem;color:var(--mut);margin-top:16px}
.dis{opacity:.45;pointer-events:none;filter:grayscale(.6)}
input:disabled{opacity:.5;cursor:not-allowed}
.lg{max-width:440px;margin:30px auto}.lg label{display:block;font-weight:700;margin:14px 0 6px;font-size:.9rem}
.lg input[type=text],.lg input[type=password]{width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.lg input:focus{outline:0;border-color:var(--pri)}
.err{color:var(--no);font-size:.88rem;min-height:1.3em;margin-top:8px}
.note{margin-top:18px;font-size:.88rem;color:var(--mut);background:var(--bg);border-radius:12px;padding:12px 14px}
.note a{color:var(--pri);font-weight:800;cursor:pointer;text-decoration:underline}
.badge{display:inline-block;background:#fff3d6;color:#8a5a00;border-radius:99px;padding:3px 10px;font-size:.75rem;font-weight:700;margin-left:6px;vertical-align:middle}
@media(max-width:560px){.modes{grid-template-columns:1fr}.card{padding:16px}}
</style>
</head>
<body>
<header><div class="hin"><h1>Latihan Soal Substansial Tes Kepala Sekolah<small>Kepribadian • Kewirausahaan • Profesional • Sosial</small></h1><button class="ib" id="lo" style="display:none" title="Keluar akun">Keluar ⎋</button><button class="ib" id="th" title="Tema gelap/terang">🌙</button></div></header>
<main id="app"></main>
<script>
const DATA=[{"cat": "Kepribadian", "q": "Anda adalah kepala sekolah yang sedang memimpin transformasi menuju Pembelajaran Mendalam, namun menghadapi resistensi dari sekelompok guru senior yang merasa metode konvensional lebih efektif. Dalam sebuah rapat koordinasi, salah satu guru secara terbuka meragukan prinsip \"pembelajaran yang menggembirakan\" karena dianggap akan menurunkan kedisiplinan siswa. Bagaimana tindakan pengendalian diri yang paling tepat Anda tunjukkan sebagai pemimpin yang berintegritas?", "opts": ["Memberikan instruksi tegas bahwa seluruh guru wajib mengikuti kebijakan baru sekolah demi mencapai visi mutu pendidikan yang telah ditetapkan.", "Menjelaskan secara mendetail landasan teori Pembelajaran Mendalam dan peraturan pemerintah yang mendukungnya agar guru senior tersebut dapat menerima perubahan.", "Meminta guru-guru muda yang sudah berhasil menerapkan prinsip tersebut untuk memberikan pembelaan dan bukti keberhasilan mereka di depan forum rapat.", "Mengabaikan kritik tersebut untuk sementara waktu guna menjaga harmoni organisasi dan tetap melanjutkan agenda rapat sesuai rencana awal.", "Melakukan jeda sejenak untuk meregulasi emosi dan kemudian memfasilitasi dialog tentang kaitannya kegembiraan belajar dengan motivasi intrinsik siswa."], "a": 4, "e": "Jeda untuk meregulasi emosi lalu membuka dialog menunjukkan pengendalian diri dan integritas; kritik dijawab dengan mengaitkan kegembiraan belajar dengan motivasi intrinsik, bukan dengan tekanan.", "w": ["Instruksi tegas adalah pendekatan otoriter yang mematikan dialog dan menambah resistensi.", "Penjelasan teori dan regulasi panjang lebar bersifat satu arah dan belum menunjukkan pengendalian emosi.", "Meminta guru muda \"membela\" di forum berpotensi memicu polarisasi antar-kelompok guru.", "Mengabaikan kritik menghindari masalah, bukan mengelolanya; keraguan guru tetap tidak terjawab.", null]}, {"cat": "Kepribadian", "q": "Hasil supervisi akademik menunjukkan bahwa banyak guru masih terjebak dalam pemberian sumber belajar yang bersifat memberitahu konsep secara satu arah, bukan membimbing siswa melakukan penemuan. Anda menyadari bahwa karakter guru sangat dipengaruhi oleh budaya kerja yang Anda bangun sebagai kepala sekolah. Langkah refleksi diri manakah yang paling mencerminkan tanggung jawab profesional Anda sebagai pengembang budaya belajar?", "opts": ["Menyusun instrumen penilaian kinerja yang lebih ketat untuk memastikan setiap guru menerapkan langkah-langkah penemuan konsep di dalam kelas.", "Menganalisis ketercukupan sarana teknologi digital dan sumber belajar di sekolah untuk mendukung perubahan paradigma mengajar para guru.", "Mengevaluasi kembali program pelatihan guru yang telah dilaksanakan dan mencari model pendampingan yang lebih menekankan pada strategi metakognitif.", "Menginstruksikan para wakil kepala sekolah untuk lebih intensif memantau rencana pelaksanaan pembelajaran yang dibuat oleh seluruh tenaga pendidik.", "Mempelajari ulang standar nasional pendidikan mengenai proses pembelajaran untuk memastikan bahwa kebijakan sekolah sudah selaras dengan aturan yang berlaku."], "a": 2, "e": "Refleksi diri yang tepat adalah mengevaluasi pelatihan yang sudah dijalankan dan mencari pendampingan metakognitif, karena perubahan karakter guru berakar pada budaya belajar yang Anda bangun sendiri.", "w": ["Instrumen penilaian lebih ketat berfokus pada kontrol, bukan refleksi atas peran pemimpin.", "Menganalisis sarana teknologi menyoroti faktor luar, padahal masalahnya pada pola pikir dan praktik mengajar.", null, "Menginstruksikan wakil kepala memantau RPP bersifat administratif dan mendelegasikan tanggung jawab.", "Mempelajari ulang standar proses hanya memastikan kesesuaian aturan, belum menyentuh akar masalah pembinaan guru."]}, {"cat": "Kepribadian", "q": "Sekolah Anda mengalami keterbatasan anggaran untuk memperbarui fasilitas ruang kelas agar lebih interaktif dan mendukung kolaborasi. Di sisi lain, Anda ingin mewujudkan lingkungan pembelajaran yang memuliakan martabat siswa melalui penataan ruang fisik yang nyaman sesuai kerangka PM. Tindakan kreatif manakah yang menunjukkan kompetensi kewirausahaan sekaligus kepribadian humanis kepala sekolah dalam situasi ini?", "opts": ["Membimbing guru dan siswa untuk berkolaborasi merancang ulang tata letak bangku dan memanfaatkan material lokal guna menciptakan ruang belajar.", "Mengajukan proposal bantuan dana tambahan kepada pemerintah daerah dengan melampirkan desain ruang kelas masa depan yang ideal bagi sekolah.", "Mengadakan rapat dengan komite sekolah untuk meminta sumbangan sukarela dari orang tua siswa guna merenovasi fasilitas kelas secara bertahap.", "Mengalihkan anggaran kegiatan ekstrakurikuler untuk sementara waktu guna memprioritaskan pembenahan ruang fisik kelas yang dianggap lebih mendesak.", "Membangun kemitraan dengan dunia industri untuk mendapatkan dana hibah tanggung jawab sosial perusahaan demi pengadaan perangkat digital di setiap kelas."], "a": 0, "e": "Solusi kreatif dengan biaya minim: melibatkan guru dan siswa merancang ulang ruang dan memanfaatkan material lokal. Ini menunjukkan jiwa wirausaha sekaligus memuliakan karena siswa dan guru menjadi pelaku.", "w": [null, "Proposal dana ke pemda bergantung pihak luar dan tidak menyelesaikan masalah keterbatasan saat ini.", "Sumbangan orang tua dapat membebani mereka dan tidak memberdayakan warga sekolah.", "Mengalihkan anggaran ekstrakurikuler mengorbankan hak belajar siswa yang lain.", "Dana CSR untuk perangkat digital tidak menjawab kebutuhan penataan ruang yang nyaman dan kolaboratif."]}, {"cat": "Kepribadian", "q": "Dalam sebuah ujian akhir semester, ditemukan fakta adanya kebocoran soal yang melibatkan salah satu oknum tenaga kependidikan demi menjaga peringkat sekolah. Sebagai pemimpin, Anda menghadapi tekanan antara menjaga citra sekolah dan menegakkan integritas moral organisasi. Keputusan kepemimpinan manakah yang paling mencerminkan konsistensi moral dan etika jabatan Anda?", "opts": ["Melakukan investigasi internal secara tertutup dan memberikan sanksi administratif kepada oknum tersebut tanpa mengumumkan kejadian ke publik.", "Memperketat prosedur keamanan ujian di masa mendatang dan memberikan arahan kepada seluruh staf mengenai dampak buruk kecurangan bagi siswa.", "Meminta saran kepada pengawas sekolah mengenai langkah terbaik yang harus diambil agar integritas sekolah tetap terjaga namun tidak merusak reputasi.", "Menganulir hasil ujian pada mata pelajaran terkait dan memberikan penjelasan transparan kepada warga sekolah mengenai kejujuran.", "Menugaskan guru bimbingan konseling untuk melakukan pembinaan karakter khusus bagi siswa yang terdampak secara psikologis akibat insiden tersebut."], "a": 3, "e": "Menganulir hasil ujian dan menjelaskannya secara transparan adalah wujud konsistensi moral: integritas ditegakkan meski berisiko pada citra sekolah.", "w": ["Investigasi tertutup tanpa pengumuman menutupi kebenaran demi citra sekolah.", "Memperketat prosedur hanya bersifat pencegahan ke depan dan tidak menangani pelanggaran yang sudah terjadi.", "Meminta saran pengawas saja menunjukkan keraguan dan mencari aman, bukan mengambil keputusan etis.", null, "Pembinaan psikologis siswa penting, tetapi tidak menyelesaikan akar pelanggaran integritas."]}, {"cat": "Kepribadian", "q": "Anda memperhatikan bahwa komunikasi antar-guru di sekolah seringkali hanya bersifat administratif dan jarang mendiskusikan perkembangan pola pikir siswa secara mendalam. Anda ingin mendorong kemitraan pembelajaran yang melibatkan olah pikir, olah hati, dan olah rasa di kalangan pendidik. Sikap kepribadian manakah yang paling tepat Anda tunjukkan untuk memicu perubahan budaya tersebut?", "opts": ["Memberikan poin tambahan pada penilaian kompetensi sosial bagi guru yang aktif berkolaborasi dengan rekan sejawat dalam proyek lintas disiplin.", "Menjadi teladan dengan sering terlibat aktif dalam diskusi informal bersama guru mengenai \"AHA moment\" yang dialami siswa.", "Menetapkan jadwal rutin diskusi \"praktik baik\" di mana guru dapat saling berbagi jurnal refleksi dan strategi mengatasi hambatan belajar siswa.", "Mengundang pakar pendidikan untuk memberikan motivasi kepada para guru mengenai pentingnya hubungan interpersonal dalam ekosistem sekolah.", "Menyediakan ruang virtual khusus pada platform digital sekolah untuk memfasilitasi komunikasi dan berbagi sumber belajar antar-tenaga pendidik."], "a": 1, "e": "Keteladanan langsung, ikut berdiskusi informal tentang \"AHA moment\" siswa, mengubah budaya komunikasi lewat contoh nyata pemimpin, sejalan dengan olah pikir, hati, dan rasa.", "w": ["Poin tambahan penilaian mendorong kerja sama karena imbalan, bukan kesadaran.", null, "Jadwal diskusi rutin bersifat struktural dan formal, bukan teladan sikap pribadi pemimpin.", "Pakar pendidikan memberi motivasi sesaat, bukan perubahan budaya berkelanjutan.", "Ruang virtual hanya menyediakan fasilitas, tanpa keterlibatan pemimpin dalam substansi diskusi."]}, {"cat": "Kepribadian", "q": "Seorang guru baru yang memiliki potensi besar dalam inovasi digital merasa tertekan karena sering mendapatkan teguran dari rekan sejawat senior terkait metode ajarnya yang dianggap \"terlalu menggembirakan\" dan kurang serius. Anda ingin menjaga motivasi guru tersebut tanpa menciptakan konflik organisasi. Langkah kepemimpinan humanis manakah yang paling sesuai untuk Anda ambil?", "opts": ["Menyarankan guru baru tersebut untuk melakukan adaptasi secara perlahan dengan budaya kerja guru senior agar harmoni tetap terjaga.", "Membimbing guru baru tersebut secara personal dalam mengembangkan strategi komunikasi yang lebih santun saat berhadapan dengan rekan sejawatnya.", "Menjelaskan kepada guru senior dalam rapat pleno mengenai keunggulan pemanfaatan teknologi digital dalam menciptakan efisiensi pembelajaran masa kini.", "Menugaskan guru baru tersebut untuk mempresentasikan hasil karyanya di depan forum ilmiah sebagai bentuk apresiasi dan perlindungan profesional.", "Memasangkan guru baru tersebut dengan guru senior dalam satu tim proyek sekolah agar terjadi proses transfer pengetahuan dan perspektif."], "a": 4, "e": "Memasangkan guru baru dengan guru senior dalam satu tim proyek menjaga motivasi tanpa konflik: keduanya saling belajar dan saling menghargai perspektif.", "w": ["Menyarankan adaptasi membuat guru inovatif menyesuaikan diri dan memadamkan potensinya.", "Pembimbingan komunikasi menempatkan guru baru sebagai pihak yang harus berubah.", "Menjelaskan di rapat pleno dapat mempermalukan guru senior dan memperbesar konflik.", "Presentasi di forum ilmiah memberi apresiasi, tetapi tidak menyelesaikan hubungan dengan rekan senior.", null]}, {"cat": "Kepribadian", "q": "Dalam menerapkan prinsip Pembelajaran Mendalam, sekolah diharapkan mampu memuliakan setiap individu. Namun, Anda menemukan data adanya kesenjangan partisipasi dalam kegiatan sekolah antara siswa dari latar belakang ekonomi tinggi dan rendah yang memengaruhi well-being mereka. Tindakan kepribadian yang paling menunjukkan kepedulian terhadap ekosistem belajar yang inklusif adalah?", "opts": ["Menyediakan bantuan subsidi biaya untuk kegiatan ekstrakurikuler bagi siswa dari keluarga kurang mampu guna meningkatkan partisipasi mereka.", "Menginstruksikan seluruh guru untuk memastikan pembagian peran dalam proyek kelompok dilakukan secara adil tanpa melihat latar belakang sosial.", "Membimbing warga sekolah untuk merefleksikan nilai-nilai kemanusiaan dan martabat individu di sekolah.", "Merancang program sekolah yang menonjolkan keberagaman budaya dan kearifan lokal yang dapat diikuti oleh seluruh siswa secara setara.", "Evaluasi kebijakan penerimaan siswa baru untuk memastikan bahwa sekolah tetap terbuka bagi berbagai lapisan masyarakat secara proporsional."], "a": 2, "e": "Membimbing warga sekolah merefleksikan nilai kemanusiaan dan martabat menumbuhkan kepedulian dari dalam sehingga budaya inklusif berakar kuat.", "w": ["Subsidi membantu sisi materi, tetapi belum mengubah cara pandang warga sekolah.", "Instruksi pembagian peran adil bersifat perintah, bukan kesadaran.", null, "Program keberagaman budaya bagus, tetapi tidak langsung menyasar kesenjangan ekonomi dan well-being.", "Evaluasi penerimaan siswa baru hanya menyentuh akses masuk, bukan iklim partisipasi di dalam sekolah."]}, {"cat": "Kepribadian", "q": "Beban kerja kepala sekolah yang sangat tinggi dalam mengelola perubahan kurikulum seringkali membuat Anda merasa kelelahan secara emosional. Anda menyadari bahwa stabilitas emosi pemimpin sangat berpengaruh pada well-being seluruh warga sekolah. Keputusan manajemen diri manakah yang paling bijaksana untuk Anda ambil guna menjaga kualitas kepemimpinan?", "opts": ["Mempraktikkan strategi regulasi diri seperti teknik pernapasan atau refleksi spiritual di sela kesibukan untuk menjaga kehadiran penuh.", "Mendelegasikan sebagian besar tugas administratif kepada para wakil kepala sekolah agar Anda memiliki waktu istirahat yang lebih cukup.", "Mengikuti kegiatan komunitas kepala sekolah secara rutin untuk berbagi beban masalah dan mendapatkan dukungan sosial dari rekan sejawat.", "Meminta jadwal supervisi kelas dikurangi untuk sementara waktu hingga kondisi fisik dan mental Anda kembali pulih sepenuhnya seperti semula.", "Menggunakan aplikasi manajemen tugas digital untuk membantu mengorganisasi prioritas pekerjaan sekolah agar menjadi lebih teratur dan efisien."], "a": 0, "e": "Regulasi diri (pernapasan, refleksi spiritual) adalah cara menjaga kestabilan emosi dan kehadiran penuh secara mandiri; pemimpin yang stabil menular pada iklim sekolah.", "w": [null, "Mendelegasikan sebagian besar tugas sekadar memindahkan beban, bukan mengelola diri.", "Berbagi beban dengan komunitas bermanfaat, tetapi bersifat dukungan luar, bukan strategi kendali diri.", "Mengurangi supervisi mengorbankan fungsi kepemimpinan pembelajaran.", "Aplikasi manajemen tugas membantu efisiensi, bukan kestabilan emosi."]}, {"cat": "Kepribadian", "q": "Anda mendapati sebuah kelompok masyarakat sekitar sekolah merasa keberatan dengan proyek keberlanjutan siswa yang melakukan observasi di lingkungan mereka karena dianggap mengganggu privasi. Sebagai pemimpin, Anda harus menjembatani kemitraan pendidikan dan masyarakat. Respon manakah yang paling mencerminkan sensitivitas sosial dan keberanian mengambil keputusan?", "opts": ["Menghentikan seluruh aktivitas observasi siswa di luar lingkungan sekolah untuk menghindari konflik yang lebih besar dengan warga sekitar.", "Mengirimkan surat permohonan maaf resmi kepada tokoh masyarakat dan menjanjikan bahwa kejadian serupa tidak akan terulang kembali.", "Menjelaskan kepada warga mengenai pentingnya dukungan masyarakat dalam menyukseskan program pendidikan yang berorientasi pada masa depan.", "Mengundang perwakilan warga untuk berdialog di sekolah guna memahami perspektif mereka dan mendesain ulang protokol interaksi sosial siswa.", "Menugaskan guru bidang studi terkait untuk memimpin sesi permohonan maaf langsung kepada warga yang merasa terganggu oleh aktivitas siswa."], "a": 3, "e": "Mengundang perwakilan warga berdialog dan mendesain ulang protokol menunjukkan sensitivitas sosial dan keberanian memutuskan tanpa mengorbankan pembelajaran.", "w": ["Menghentikan seluruh observasi mengorbankan pengalaman belajar nyata siswa.", "Surat permohonan maaf dengan janji tanpa dialog tidak menyelesaikan keberatan warga.", "Menjelaskan pentingnya dukungan bersifat satu arah dan tidak mendengar perspektif warga.", null, "Menugaskan guru meminta maaf melempar tanggung jawab yang seharusnya dipikul pemimpin."]}, {"cat": "Kepribadian", "q": "Sekolah Anda terpilih sebagai pilot project untuk implementasi sistem informasi sekolah berbasis kecerdasan artifisial, namun sebagian besar staf administrasi merasa cemas akan digantikan oleh teknologi. Anda ingin memastikan pemanfaatan digital tetap memuliakan potensi manusia. Sikap terbuka terhadap perubahan manakah yang paling tepat Anda tunjukkan dalam situasi ini?", "opts": ["Menjamin bahwa tidak akan ada pengurangan staf dan memberikan pelatihan peningkatan keterampilan baru yang relevan dengan bantuan teknologi.", "Mengajak staf administrasi untuk berdiskusi pemahaman teknologi untuk mengurangi beban kerja rutin dan meningkatkan efisiensi.", "Menjelaskan bahwa perubahan teknologi adalah tuntutan zaman yang tidak bisa dihindari oleh organisasi manapun jika ingin tetap relevan dan maju.", "Menunda implementasi sistem tersebut hingga seluruh staf benar-benar siap secara mental dan memiliki kemampuan teknis yang memadai secara merata.", "Memberikan apresiasi khusus bagi staf yang paling cepat beradaptasi dengan sistem baru sebagai contoh bagi rekan sejawat yang lainnya di kantor."], "a": 1, "e": "Mengajak staf berdiskusi tentang teknologi untuk mengurangi beban kerja adalah sikap terbuka yang mendengar kecemasan sekaligus memuliakan potensi manusia.", "w": ["Jaminan tanpa pengurangan staf lebih bersifat menenangkan; belum melibatkan staf memahami perubahan.", null, "Menyebut perubahan tak terhindarkan cenderung menekan dan mengabaikan perasaan staf.", "Menunda implementasi menghambat inovasi dan menghindari masalah.", "Apresiasi untuk yang tercepat dapat menekan staf yang masih cemas dan memicu kesenjangan."]}, {"cat": "Kepribadian", "q": "Seorang guru senior mendapatkan kritik keras dari orang tua karena dianggap terlalu kaku dan sering memberikan sanksi fisik ringan yang tidak sejalan dengan budaya memuliakan. Anda ingin memperbaiki cara pembinaan guru tersebut agar lebih humanis sesuai nilai PM. Pendekatan \"Olah Hati\" manakah yang paling tepat Anda lakukan sebagai kepala sekolah?", "opts": ["Memberikan teguran lisan secara tegas berdasarkan peraturan disiplin pegawai dan meminta guru tersebut untuk segera mengubah pola interaksinya.", "Menugaskan guru tersebut untuk mengikuti pelatihan manajemen kelas yang berbasis pada psikologi perkembangan anak dan komunikasi yang empatik.", "Memfasilitasi pertemuan antara guru tersebut dan orang tua siswa untuk menyelesaikan kesalahpahaman secara musyawarah dan kekeluargaan di sekolah.", "Memindahkan guru tersebut ke bagian administrasi untuk sementara waktu agar tensi hubungan dengan siswa dan orang tua dapat menurun secara alami.", "Mengajak guru tersebut berdiskusi secara pribadi dan membimbingnya merefleksikan dampak emosional sanksi bagi siswa."], "a": 4, "e": "Pembinaan olah hati dilakukan lewat diskusi pribadi yang membimbing guru merefleksikan dampak emosional sanksi; kesadaran tumbuh dari dalam.", "w": ["Teguran lisan tegas bersifat represif dan tidak menyentuh kesadaran guru.", "Pelatihan manajemen kelas bermanfaat, tetapi berupa penugasan eksternal tanpa refleksi pribadi.", "Mempertemukan dengan orang tua hanya meredam konflik, bukan memperbaiki cara pembinaan guru.", "Memindahkan ke administrasi menghindari masalah dan tidak memuliakan guru.", null]}, {"cat": "Kepribadian", "q": "Dalam mengevaluasi mutu pendidikan, Anda menemukan bahwa siswa memiliki nilai akademik tinggi namun kurang memiliki kepedulian sosial terhadap isu lingkungan di sekitar sekolah. Anda ingin mendorong pengembangan dimensi \"Kewargaan\" secara lebih nyata. Langkah strategis manakah yang menunjukkan keteladanan Anda sebagai pemimpin pendidikan?", "opts": ["Menginstruksikan seluruh guru mata pelajaran untuk menyelipkan materi mengenai pelestarian lingkungan dalam setiap sesi pembelajaran di ruang kelas.", "Mewajibkan seluruh siswa untuk mengikuti kegiatan kerja bakti lingkungan di sekitar sekolah setiap akhir pekan sebagai bagian dari penilaian karakter.", "Memimpin langsung proyek kolaboratif sekolah dalam membersihkan area publik terdekat untuk menunjukkan komitmen nyata sebagai warga.", "Menyusun rubrik penilaian karakter yang lebih komprehensif untuk mengukur tingkat kepedulian sosial siswa sebagai syarat kelulusan dari sekolah.", "Membangun kemitraan dengan organisasi pegiat lingkungan untuk memberikan workshop edukasi bagi siswa mengenai tantangan ekosistem masa depan."], "a": 2, "e": "Memimpin langsung proyek pembersihan area publik adalah keteladanan nyata sebagai warga; kewargaan ditumbuhkan lewat contoh, bukan hanya perintah.", "w": ["Instruksi menyelipkan materi lingkungan hanya mendelegasikan kepada guru.", "Mewajibkan kerja bakti sebagai nilai karakter bersifat paksaan, bukan keteladanan.", null, "Rubrik penilaian dan syarat kelulusan lebih bersifat administratif dan menekan.", "Workshop dengan pegiat lingkungan berguna, tetapi tidak menunjukkan komitmen pribadi pemimpin."]}, {"cat": "Kepribadian", "q": "Anda menemukan fakta bahwa laporan kemajuan program sekolah yang dikirimkan ke dinas pendidikan berisi data prestasi siswa yang telah dimanipulasi oleh tim kurikulum agar sekolah terlihat unggul. Anda menjunjung tinggi kejujuran akademik sesuai prinsip PM. Tindakan manakah yang paling mencerminkan integritas kepribadian pemimpin dalam situasi sulit ini?", "opts": ["Meminta tim kurikulum untuk segera memperbaiki data tersebut dan mengirimkan laporan susulan yang akurat serta jujur.", "Memberikan pembinaan tertutup kepada tim kurikulum agar tidak mengulangi perbuatan tersebut karena berisiko merusak reputasi sekolah di masa depan.", "Melaporkan kesalahan data tersebut kepada dinas pendidikan sebagai bentuk transparansi dan tanggung jawab moral sebagai kepala satuan pendidikan.", "Menjelaskan kepada warga sekolah mengenai pentingnya menjunjung tinggi nilai kejujuran di atas pencapaian prestasi yang bersifat semu dan sementara.", "Mengevaluasi sistem pelaporan internal sekolah untuk memastikan adanya mekanisme verifikasi data yang berlapis sebelum dikirimkan ke pihak luar."], "a": 0, "e": "Meminta tim memperbaiki dan mengirim laporan susulan yang jujur langsung mengoreksi pelanggaran dan menegakkan kejujuran akademik pada saat itu juga.", "w": [null, "Pembinaan tertutup dengan alasan reputasi belum memperbaiki data yang sudah salah terkirim.", "Melapor ke dinas adalah transparansi, tetapi tanpa terlebih dahulu memperbaiki data pada sumbernya.", "Penjelasan tentang pentingnya kejujuran bersifat imbauan dan tidak menangani kasusnya.", "Evaluasi sistem pelaporan hanya pencegahan ke depan."]}, {"cat": "Kepribadian", "q": "Saat melakukan observasi kelas, Anda melihat seorang guru sangat menguasai materi namun gagal menciptakan suasana belajar yang menggembirakan karena terlalu fokus pada ketuntasan kurikulum. Anda ingin guru tersebut mampu menjadi \"Aktivator\" siswa. Saran pembinaan manakah yang paling mencerminkan prinsip kepemimpinan yang memuliakan?", "opts": ["Menyarankan guru tersebut untuk lebih banyak menggunakan media permainan edukatif guna memecah kekakuan suasana belajar di dalam ruang kelas.", "Menugaskan guru tersebut untuk mengobservasi rekan sejawat lainnya yang sudah berhasil menciptakan lingkungan belajar yang interaktif dan dinamis.", "Menyarankan agar guru tersebut mengurangi porsi ceramah satu arah dan lebih banyak memberikan pertanyaan pemantik yang menantang nalar kritis siswa.", "Memberikan apresiasi atas penguasaan materinya dan mengajak guru tersebut merefleksikan kembali makna \"AHA moment\".", "Memberikan bantuan teknis berupa perangkat digital terbaru agar guru tersebut dapat lebih variatif dalam menyajikan materi pembelajaran di kelas."], "a": 3, "e": "Mengapresiasi penguasaan materi lalu mengajak guru merefleksikan makna \"AHA moment\" memuliakan guru dan menumbuhkan kesadaran dari dalam, cocok dengan peran aktivator.", "w": ["Menyarankan permainan edukatif hanya memberi teknik, tanpa refleksi makna.", "Mengobservasi rekan lain bersifat penugasan yang belum tentu menumbuhkan kesadaran.", "Mengurangi ceramah dan memakai pertanyaan pemantik adalah saran teknis yang bersifat instruktif.", null, "Bantuan perangkat digital tidak menyentuh akar masalah pola mengajar."]}, {"cat": "Kepribadian", "q": "Sekolah Anda memiliki program kedisiplinan \"Satu Hari Tanpa Gadget\", namun banyak guru justru tetap asyik menggunakan telepon genggam di depan siswa saat jam istirahat. Hal ini menciptakan ketidakkonsistenan antara aturan dan perilaku. Langkah kepemimpinan manakah yang paling tepat untuk menunjukkan keteladanan akhlak mulia?", "opts": ["Membuat aturan tertulis baru yang melarang penggunaan gadget bagi guru di area terbuka sekolah selama jam pelajaran dan jam istirahat berlangsung.", "Anda sendiri secara konsisten tidak menggunakan gadget di area sekolah dan aktif berinteraksi sosial dengan siswa serta guru selama jam istirahat.", "Mengingatkan guru-guru dalam rapat pleno mengenai pentingnya menjadi model perilaku yang positif bagi siswa dalam menegakkan kesepakatan bersama.", "Menugaskan para wakil kepala sekolah untuk memberikan teguran secara santun namun tegas bagi guru yang masih melanggar aturan penggunaan gadget.", "Memfasilitasi diskusi reflektif antar-guru mengenai kaitan antara manajemen diri pemimpin dengan efektivitas penanaman nilai karakter pada peserta didik."], "a": 1, "e": "Keteladanan terkuat adalah konsistensi Anda sendiri: tidak menggunakan gadget dan aktif berinteraksi. Guru meniru perilaku, bukan aturan.", "w": ["Aturan tertulis baru bersifat kontrol dan tidak menyelesaikan ketidakkonsistenan.", null, "Mengingatkan di rapat pleno hanya berupa imbauan lisan.", "Menugaskan wakil menegur mendelegasikan tanggung jawab keteladanan.", "Diskusi reflektif membangun kesadaran, tetapi belum menunjukkan teladan dari pemimpin."]}, {"cat": "Kepribadian", "q": "Anda menyadari bahwa visi sekolah mengenai Pembelajaran Mendalam tidak akan tercapai tanpa dukungan penuh dari orang tua siswa di rumah. Anda ingin membangun kemitraan yang melampaui urusan pembiayaan pendidikan. Bentuk kolaborasi manakah yang paling mencerminkan kompetensi sosial dan kepribadian terbuka kepala sekolah?", "opts": ["Mengadakan pertemuan rutin dengan orang tua untuk memaparkan hasil asesmen portofolio siswa yang menunjukkan perkembangan dimensi profil lulusan.", "Membuat buletin digital mingguan yang berisi panduan praktis bagi orang tua tentang cara mendampingi anak dalam melakukan refleksi belajar mandiri.", "Memfasilitasi forum diskusi antara guru dan orang tua untuk menyinergikan strategi stimulasi motivasi intrinsik anak selama berada di lingkungan keluarga.", "Menyediakan akses bagi orang tua untuk memantau kehadiran dan nilai ujian harian anak secara real-time melalui aplikasi manajemen sekolah digital.", "Mengundang orang tua yang memiliki keahlian khusus untuk menjadi guru tamu dalam proyek inkuiri siswa."], "a": 4, "e": "Mengundang orang tua berkeahlian menjadi guru tamu dalam proyek inkuiri menjadikan orang tua mitra aktif pembelajaran, melampaui urusan biaya dan pelaporan.", "w": ["Pertemuan pemaparan asesmen bersifat komunikasi satu arah.", "Buletin panduan juga satu arah dan orang tua sebatas penerima informasi.", "Forum diskusi guru dan orang tua baik, tetapi masih sebatas sinergi strategi, bukan keterlibatan langsung.", "Akses pemantauan nilai real-time berfokus pada pengawasan, bukan kemitraan pembelajaran.", null]}, {"cat": "Kepribadian", "q": "Seorang staf administrasi senior melakukan kesalahan fatal dalam pengelolaan data keuangan BOS yang dapat berakibat pada audit negatif. Staf tersebut merasa sangat bersalah dan takut akan kehilangan pekerjaannya. Respon kepemimpinan manakah yang paling menunjukkan kedewasaan emosional dan olah hati?", "opts": ["Menenangkan kondisi psikologis staf tersebut dan mengajaknya berdiskusi mengenai akar masalah serta solusi pemecahan.", "Memberikan sanksi administratif sesuai aturan yang berlaku namun juga mendampingi staf tersebut dalam memperbaiki kesalahan datanya secara teliti.", "Menugaskan bendahara sekolah yang lebih mahir untuk mengambil alih sementara tugas staf tersebut hingga proses audit dinas selesai dilakukan.", "Menjelaskan kepada seluruh staf administrasi mengenai pentingnya ketelitian dan akuntabilitas dalam pengelolaan sumber daya sekolah yang optimal.", "Mengarahkan staf tersebut untuk melakukan studi banding ke sekolah lain yang memiliki sistem pengelolaan keuangan yang lebih teratur dan sistematis."], "a": 0, "e": "Menenangkan staf lalu berdiskusi mencari akar masalah dan solusi menunjukkan kedewasaan emosional dan olah hati, karena rasa bersalah dan takut ditangani lebih dulu.", "w": [null, "Sanksi administratif segera terasa menghukum dan belum menenangkan staf.", "Mengambil alih tugas melepas tanggung jawab staf dan tidak membangun pembelajaran dari kesalahan.", "Menjelaskan pentingnya ketelitian kepada semua staf tidak menyentuh staf yang bersangkutan.", "Studi banding menggeser fokus dari pendampingan personal."]}, {"cat": "Kepribadian", "q": "Dalam merancang program pengembangan diri bagi guru, Anda ingin memastikan bahwa setiap guru merasa dihargai potensi dan minatnya yang unik sesuai fitrah masing-masing. Anda menghindari pendekatan \"satu cara untuk semua\". Tindakan manakah yang paling mencerminkan prinsip diferensiasi dalam kepemimpinan Anda?", "opts": ["Memberikan kebebasan kepada setiap guru untuk memilih topik pelatihan mandiri yang paling relevan dengan kebutuhan pengembangan kompetensi mereka.", "Mengadakan survei kebutuhan belajar guru sebelum menyusun jadwal program pengembangan profesionalisme guru di setiap awal tahun ajaran.", "Menyediakan berbagai macam sumber belajar digital dan literatur pendidikan yang dapat diakses oleh guru kapan pun mereka membutuhkannya.", "Memfasilitasi pembentukan komunitas belajar antar-guru berdasarkan minat disiplin ilmu atau kemitraan pembelajaran yang ingin dikembangkan.", "Memberikan penghargaan bagi guru yang menunjukkan kemajuan signifikan dalam penguasaan strategi Pembelajaran Mendalam di ruang kelas."], "a": 3, "e": "Komunitas belajar berdasarkan minat atau kemitraan mencerminkan diferensiasi karena guru berkembang sesuai potensinya dalam kelompok yang bermakna.", "w": ["Kebebasan memilih topik mandiri kurang terarah dan tidak membangun kolaborasi.", "Survei kebutuhan hanya pemetaan awal; programnya tetap bisa seragam.", "Menyediakan sumber belajar untuk semua sifatnya umum, bukan diferensiasi.", null, "Penghargaan bagi yang berprestasi tidak menjawab kebutuhan setiap guru."]}, {"cat": "Kepribadian", "q": "Sekolah Anda kedatangan siswa pindahan yang memiliki kebutuhan khusus (difabel), namun fasilitas fisik sekolah belum memadai. Beberapa guru khawatir kehadiran siswa tersebut akan menghambat ritme belajar siswa lainnya. Sikap kepribadian manakah yang menunjukkan keberanian Anda mengambil keputusan yang inklusif?", "opts": ["Menerima siswa tersebut dengan hangat dan segera merencanakan modifikasi fasilitas fisik sekolah secara bertahap dengan melibatkan komite.", "Membimbing seluruh warga sekolah untuk berefleksi mengenai nilai kemanusiaan dan keadilan dalam memberikan hak pendidikan.", "Menugaskan guru pendamping khusus untuk membantu siswa tersebut di kelas agar proses belajar siswa lainnya tidak mengalami gangguan teknis.", "Mengadakan sesi pembekalan bagi para guru mengenai cara mengelola kelas inklusif yang tetap menantang bagi seluruh siswa dengan berbagai kemampuan.", "Menyarankan orang tua siswa tersebut untuk berkonsultasi dengan pakar pendidikan inklusif guna mendapatkan saran strategi belajar yang paling tepat."], "a": 1, "e": "Refleksi kolektif tentang nilai kemanusiaan dan keadilan menumbuhkan sikap inklusif dari dalam diri warga sekolah, sesuai keberanian mengambil keputusan inklusif.", "w": ["Modifikasi fasilitas bertahap penting, tetapi belum mengubah cara pandang guru yang ragu.", null, "Menugaskan guru pendamping khusus bersifat teknis dan cenderung memisahkan siswa.", "Pembekalan kelas inklusif bersifat teknis-instruksional dan belum menyentuh nilai.", "Menyarankan orang tua berkonsultasi melempar tanggung jawab kepada pihak luar."]}, {"cat": "Kepribadian", "q": "Anda ingin meningkatkan efektivitas monitoring program melalui pemanfaatan teknologi digital, namun Anda sendiri merasa belum mahir dalam menggunakan aplikasi analisis data terbaru. Anda menyadari pemimpin harus menjadi pembelajar sepanjang hayat. Tindakan manakah yang paling mencerminkan kerendahan hati dan semangat belajar Anda?", "opts": ["Membaca buku panduan penggunaan aplikasi secara mandiri di rumah hingga Anda benar-benar menguasainya sebelum mempresentasikan kepada staf.", "Meminta bantuan operator sekolah untuk mengerjakan seluruh pengolahan data monitoring sehingga Anda tinggal menerima laporan hasil akhirnya saja.", "Membangun kemitraan dengan guru-guru muda yang mahir teknologi untuk belajar bersama dalam mengoperasikan.", "Menugaskan wakil kepala sekolah bidang sarana prasarana untuk menyelenggarakan workshop internal mengenai pemanfaatan digital bagi seluruh staf.", "Menyarankan penggunaan metode analisis data yang lebih konvensional namun sudah Anda kuasai dengan baik demi menjaga akurasi hasil evaluasi."], "a": 2, "e": "Membangun kemitraan belajar bersama guru muda yang mahir teknologi menunjukkan kerendahan hati dan semangat belajar sepanjang hayat: pemimpin belajar langsung dari yang lebih mahir.", "w": ["Belajar mandiri di rumah baik, tetapi menunggu sempurna dulu dan tidak melibatkan tim.", "Menyerahkan pengolahan data kepada operator berarti menghindari pembelajaran.", null, "Menugaskan wakil kepala menyelenggarakan workshop mendelegasikan tanpa keterlibatan belajar pemimpin sendiri.", "Kembali ke metode konvensional menolak perubahan demi kenyamanan diri."]}, {"cat": "Kewirausahaan", "q": "Kompetensi kewirausahaan pada hakikatnya adalah kemampuan dalam menciptakan hal-hal baru melalui inovasi yang memberikan nilai tambah bagi organisasi. Bagaimanakah integrasi naluri kewirausahaan tersebut dalam penciptaan tata kelola sumber daya mampu menjamin prinsip memuliakan potensi fitrah setiap individu secara inklusif?", "opts": ["Optimalisasi aset sekolah difokuskan pada pemenuhan standar sarana fisik yang merata tanpa mempertimbangkan keragaman kebutuhan.", "Naluri kewirausahaan diarahkan untuk menciptakan program-program yang mengakomodasi minat dan bakat beragam peserta didik.", "Kepala sekolah memprioritaskan komersialisasi produk karya siswa sebagai bagian dari pembelajaran kewirausahaan yang terintegrasi.", "Optimalisasi aset sekolah difokuskan untuk memfasilitasi keragaman kebutuhan belajar melalui lingkungan yang aman dan suportif.", "Manajemen sumber daya ditekankan pada pengembangan kurikulum yang adaptif dengan memanfaatkan potensi lokal secara optimal."], "a": 3, "e": "Optimalisasi aset untuk memfasilitasi keragaman kebutuhan belajar melalui lingkungan aman dan suportif menjawab inti \"memuliakan\" secara inklusif dalam tata kelola sumber daya.", "w": ["Pemenuhan sarana fisik yang merata mengabaikan keragaman kebutuhan individu.", "Program minat bakat baik, tetapi fokusnya program, bukan tata kelola sumber daya seperti ditanyakan.", "Komersialisasi produk siswa bergeser ke orientasi bisnis, bukan inklusivitas.", null, "Pengembangan kurikulum adaptif berbasis potensi lokal berfokus pada kurikulum, bukan tata kelola sumber daya."]}, {"cat": "Kewirausahaan", "q": "Kewirausahaan menuntut keberanian pemimpin untuk mengambil risiko yang terhitung (calculated risk) guna menghadirkan pembaharuan dalam sistem pendidikan. Mengapa sikap ini menjadi prasyarat fundamental bagi terciptanya budaya belajar yang memberikan ruang bagi siswa untuk bereksperimen?", "opts": ["Guna memastikan setiap eksperimen proyek siswa dikelola dengan pendampingan intensif sehingga kegagalan dapat diminimalkan.", "Kepemimpinan yang berani mengambil risiko bertujuan untuk membuka peluang inovasi tanpa takut akan kegagalan sebagai bagian belajar.", "Keteladanan pemimpin dalam menghadapi ketidakpastian memberikan rasa aman bagi komunitas untuk berinovasi dan berefleksi.", "Pengambilan risiko difokuskan pada pengembangan model pembelajaran baru yang diuji coba secara bertahap dengan evaluasi berkala.", "Karakteristik ini digunakan pimpinan untuk mendorong guru dan siswa keluar dari zona nyaman secara terukur dan bertanggung jawab."], "a": 2, "e": "Keteladanan pemimpin menghadapi ketidakpastian memberi rasa aman bagi komunitas untuk berinovasi dan berefleksi; ruang bereksperimen tumbuh dari rasa aman.", "w": ["Pendampingan intensif untuk meminimalkan kegagalan justru membatasi ruang bereksperimen.", "Tanpa takut gagal benar secara ide, tetapi tidak menjelaskan mengapa pemimpin menjadi prasyarat budaya belajar.", null, "Uji coba bertahap dengan evaluasi berkala berfokus pada mekanisme, bukan budaya.", "Mendorong keluar dari zona nyaman secara terukur menekankan tuntutan, bukan rasa aman."]}, {"cat": "Kewirausahaan", "q": "Inovasi dalam konteks kewirausahaan pendidikan adalah penerapan gagasan kreatif untuk memperbaiki kualitas layanan dan proses pembelajaran secara berkelanjutan. Bagaimana peran inovatif kepala sekolah dalam mendesain program unggulan mampu memperkuat prinsip \"Bermakna\" bagi kehidupan nyata siswa?", "opts": ["Desain program memfasilitasi keterhubungan antara konsep teoretis dengan penyelesaian masalah nyata di lingkungan sekitar.", "Inovasi program difokuskan pada pengembangan proyek kolaboratif yang melibatkan masyarakat sekitar sebagai mitra belajar.", "Program unggulan diarahkan untuk menumbuhkan jiwa kewirausahaan sosial melalui kegiatan yang berdampak langsung pada komunitas.", "Kepala sekolah menetapkan regulasi yang mengintegrasikan isu-isu aktual ke dalam kurikulum secara fleksibel dan kontekstual.", "Pimpinan mengutamakan pembangunan jejaring kemitraan dengan dunia usaha untuk memberikan pengalaman belajar autentik bagi siswa."], "a": 0, "e": "Desain program yang menghubungkan konsep teoretis dengan masalah nyata di lingkungan sekitar adalah esensi prinsip \"Bermakna\": pengetahuan terhubung dengan kehidupan nyata.", "w": [null, "Proyek kolaboratif dengan masyarakat menekankan bentuk kemitraan, bukan keterkaitan konsep dengan kehidupan nyata.", "Kewirausahaan sosial berfokus pada dampak komunitas, bukan kebermaknaan belajar.", "Regulasi integrasi isu aktual bersifat kebijakan administratif.", "Jejaring dunia usaha adalah sarana, bukan inti kebermaknaan."]}, {"cat": "Kewirausahaan", "q": "Motivasi berprestasi tinggi merupakan dorongan internal pemimpin wirausaha untuk mencapai kesuksesan dalam melaksanakan tugas pokok dan fungsinya. Sejauh mana semangat pantang menyerah pimpinan ini berkontribusi pada penciptaan atmosfer \"Menggembirakan\" (joyful) di sekolah?", "opts": ["Motivasi pimpinan digunakan sebagai instrumen untuk menciptakan tantangan yang memacu kreativitas tanpa menimbulkan tekanan berlebihan.", "Semangat dalam mencari solusi kreatif membangun ekosistem yang inspiratif dan menantang bagi guru serta siswa.", "Fokus motivasi pimpinan adalah pemberian apresiasi non-materiil yang memicu semangat kolaborasi dan inovasi berkelanjutan.", "Pimpinan mengutamakan penyusunan program pengayaan yang menyenangkan sekaligus menantang kemampuan berpikir kritis siswa.", "Semangat berprestasi pimpinan diarahkan untuk menciptakan budaya sekolah yang dinamis dan adaptif terhadap perubahan zaman."], "a": 1, "e": "Semangat mencari solusi kreatif membangun ekosistem inspiratif dan menantang bagi guru serta siswa; pantang menyerah pemimpin menular menjadi suasana yang menggembirakan.", "w": ["Tantangan tanpa tekanan berlebih baik, tetapi tidak menjelaskan kontribusi semangat pantang menyerah.", null, "Apresiasi non-materiil berfokus pada penghargaan, bukan semangat pantang menyerah.", "Program pengayaan berfokus pada kegiatan, bukan peran motivasi pemimpin.", "Budaya dinamis dan adaptif terlalu umum dan tidak menyentuh \"menggembirakan\"."]}, {"cat": "Kewirausahaan", "q": "Wirausaha pendidikan harus memiliki kapasitas untuk mengevaluasi peluang eksternal guna mengoptimalkan sumber daya demi kepentingan pembelajaran. Bagaimana efektivitas kapasitas ini dalam memperkuat elemen \"Kemitraan Pembelajaran\" yang mendukung kolaborasi inkuiri?", "opts": ["Evaluasi peluang difokuskan pada pencarian mitra yang dapat memberikan kontribusi nyata terhadap pengayaan sumber belajar siswa.", "Pimpinan menggunakan kemitraan untuk membangun program magang atau proyek bersama yang relevan dengan kebutuhan dunia nyata.", "Hubungan dengan mitra dirancang sebagai wadah kolaborasi riset dan pengabdian masyarakat yang melibatkan siswa secara aktif.", "Pemimpin membuka akses mitra luar untuk berkontribusi dalam pengembangan kurikulum secara selektif dan tetap berpijak pada nilai lokal.", "Kapasitas pimpinan dalam melihat peluang memfasilitasi jejaring yang memberikan akses sumber daya bagi pendalaman pengetahuan."], "a": 4, "e": "Kapasitas melihat peluang memfasilitasi jejaring yang memberi akses sumber daya bagi pendalaman pengetahuan; itulah hubungan langsung evaluasi peluang dengan kemitraan pembelajaran.", "w": ["Mencari mitra berfokus pada pengayaan sumber, belum pada kemitraan kolaborasi inkuiri.", "Magang atau proyek bersama menyempit pada bentuk program tertentu.", "Riset dan pengabdian masyarakat hanya salah satu bentuk kolaborasi.", "Akses mitra ke kurikulum selektif berfokus pada kurikulum, bukan evaluasi peluang eksternal.", null]}, {"cat": "Kewirausahaan", "q": "Pengelolaan kegiatan produksi atau jasa sekolah merupakan manifestasi naluri kewirausahaan pemimpin untuk mengembangkan kemandirian organisasi. Mengapa unit usaha tersebut harus diposisikan sebagai sumber belajar peserta didik dalam kerangka Pembelajaran Mendalam?", "opts": ["Agar sekolah memiliki pengalaman mengelola bisnis yang dapat menjadi laboratorium kewirausahaan siswa secara praktis.", "Naluri bisnis pemimpin diarahkan untuk menciptakan proyek-produk yang dikerjakan siswa sebagai bagian dari asesmen proyek.", "Fokus pengelolaan jasa sekolah adalah untuk memberikan pengalaman nyata dalam manajemen, pemasaran, dan pelayanan pelanggan.", "Unit usaha menjadi wahana bagi siswa untuk mengaplikasikan pemahaman konsep kontekstual dan mengasah regulasi diri.", "Pimpinan mewajibkan setiap unit usaha melibatkan siswa dalam proses perancangan, produksi, dan evaluasi produk secara aktif."], "a": 3, "e": "Unit usaha sebagai wahana menerapkan konsep kontekstual dan mengasah regulasi diri sesuai hakikat Pembelajaran Mendalam: belajar bermakna dan kemandirian.", "w": ["Laboratorium kewirausahaan praktis hanya menekankan pengalaman bisnis.", "Proyek-produk sebagai asesmen proyek bersifat teknis penilaian.", "Pengalaman manajemen dan pemasaran hanya keterampilan bisnis, bukan pendalaman konsep dan regulasi diri.", null, "Mewajibkan keterlibatan siswa bersifat prosedural, bukan alasan pedagogis."]}, {"cat": "Kewirausahaan", "q": "Transformasi digital menuntut kepala sekolah sebagai pemimpin wirausaha untuk memiliki kecakapan dalam kebijakan berbasis teknologi informasi. Bagaimana visi digitalisasi pimpinan mampu menguatkan profil lulusan pada dimensi \"Penalaran Kritis\" dan \"Kreativitas\"?", "opts": ["Visi digital ditekankan pada penyediaan platform kolaborasi daring yang memungkinkan siswa bertukar ide secara kritis dan kreatif.", "Pimpinan menginstruksikan penggunaan teknologi digital sebagai alat eksplorasi pengetahuan, simulasi, dan pemecahan masalah.", "Pemanfaatan teknologi diposisikan sebagai katalisator untuk mengeksplorasi ide orisinal dan menganalisis validitas informasi.", "Visi pemimpin diarahkan untuk mengintegrasikan literasi data, coding, dan desain digital sebagai kompetensi dasar siswa.", "Fokus transformasi digital adalah menciptakan ruang belajar virtual yang mendorong proyek kolaboratif lintas disiplin."], "a": 2, "e": "Teknologi sebagai katalisator mengeksplorasi ide orisinal dan menganalisis validitas informasi menguatkan penalaran kritis dan kreativitas secara langsung.", "w": ["Platform kolaborasi daring menekankan sarana pertukaran ide, bukan proses penalaran kritis.", "Alat eksplorasi dan simulasi bersifat instruksional tanpa menekankan analisis validitas dan orisinalitas.", null, "Literasi data dan coding fokus pada keterampilan teknis, bukan penalaran kritis.", "Ruang belajar virtual lintas disiplin berfokus pada kolaborasi."]}, {"cat": "Kewirausahaan", "q": "Sikap pantang menyerah dalam menghadapi kendala organisasi merupakan watak pemimpin wirausaha yang memberikan energi positif bagi komunitas. Sejauh mana kegigihan pimpinan ini mencerminkan implementasi strategi scaffolding dalam supervisi akademik?", "opts": ["Sikap tersebut diwujudkan dengan memberikan bantuan teknis yang semakin berkurang seiring berkembangnya kompetensi guru.", "Pimpinan memberikan dukungan terukur dan bertahap guna menumbuhkan kepercayaan diri serta kapasitas guru dalam mendidik.", "Pemimpin mengambil alih perencanaan pembelajaran secara bertahap hingga guru mampu mandiri dalam mendesain pembelajarannya.", "Fokus pimpinan adalah memberikan pendampingan individual berdasarkan tingkat kesiapan setiap guru secara fleksibel.", "Kegigihan pemimpin diarahkan untuk memastikan seluruh guru mendapatkan pelatihan berkelanjutan sesuai kebutuhan spesifiknya."], "a": 1, "e": "Dukungan terukur dan bertahap untuk menumbuhkan kepercayaan diri serta kapasitas guru merupakan inti scaffolding, dan kegigihan pemimpin memberi energi positif bagi proses itu.", "w": ["Bantuan teknis yang berkurang menggambarkan mekanisme scaffolding, bukan kegigihan pemimpin.", null, "Mengambil alih perencanaan menciptakan ketergantungan, bertentangan dengan tujuan kemandirian.", "Pendampingan individual fleksibel menggambarkan diferensiasi, kurang terkait kegigihan.", "Pelatihan berkelanjutan sesuai kebutuhan menekankan program, bukan scaffolding dalam supervisi."]}, {"cat": "Kewirausahaan", "q": "Kepemimpinan transformasional-kewirausahaan berfokus pada penggerakan potensi warga sekolah menuju standar mutu yang melampaui harapan. Bagaimana prinsip ini mampu menggeser paradigma asesmen sekolah menuju konsep assessment as learning?", "opts": ["Melalui inovasi kebijakan, pimpinan mendorong penggunaan penilaian diri dan sejawat sebagai media refleksi strategi belajar.", "Pimpinan menetapkan sistem penilaian portofolio yang menekankan pada proses pertumbuhan dan umpan balik berkelanjutan.", "Fokus kebijakan pimpinan adalah mengintegrasikan refleksi mandiri dalam setiap tahap proyek siswa secara sistematis.", "Kepala sekolah memberikan pelatihan bagi guru dalam merancang asesmen formatif yang memberdayakan siswa sebagai evaluator.", "Pimpinan mewajibkan adanya sesi konferensi siswa-guru untuk mendiskusikan capaian dan rencana tindak lanjut belajar."], "a": 0, "e": "Inovasi kebijakan yang mendorong penilaian diri dan sejawat sebagai media refleksi strategi belajar menggeser paradigma menuju assessment as learning.", "w": [null, "Portofolio menekankan proses dan umpan balik, tetapi bukan bentuk khas assessment as learning.", "Refleksi mandiri di tiap tahap proyek adalah alat, bukan pergeseran paradigma asesmen.", "Pelatihan asesmen formatif untuk guru berfokus pada peran guru, bukan siswa sebagai penilai.", "Konferensi siswa-guru sebatas format komunikasi."]}, {"cat": "Kewirausahaan", "q": "Kompetensi utuh peserta didik mencakup keseimbangan antara kecerdasan intelektual, sosio-emosional, spiritual, dan fisik. Mengapa integrasi antara olah pikir, olah hati, olah rasa, dan olah raga dalam program inovatif menjadi krusial dalam kerangka kewirausahaan kepala sekolah?", "opts": ["Agar beban kurikulum dapat didistribusikan secara seimbang sehingga tidak ada aspek kepribadian yang terabaikan.", "Integrasi tersebut dimaksudkan untuk memberikan pengalaman belajar holistik yang mengembangkan seluruh dimensi manusia.", "Kombinasi elemen tersebut memfasilitasi pengembangan kepribadian seimbang agar lulusan siap menghadapi tantangan hidup.", "Fokus pimpinan adalah merancang kegiatan lintas bidang yang mengasah kecerdasan majemuk secara terpadu dan bermakna.", "Keempat dimensi tersebut menjadi fondasi dalam penyusunan profil pelajar Pancasila yang seimbang dan kontekstual."], "a": 2, "e": "Kombinasi olah pikir, hati, rasa, dan raga memfasilitasi kepribadian seimbang sehingga lulusan siap menghadapi tantangan hidup; itulah alasan krusial integrasinya.", "w": ["Pemerataan beban kurikulum hanya soal distribusi, bukan alasan pengembangan manusia utuh.", "Pengalaman belajar holistik hanya mengulang tujuannya, tidak menjelaskan mengapa krusial.", null, "Kegiatan lintas bidang untuk kecerdasan majemuk bersifat teknis program.", "Fondasi profil pelajar Pancasila adalah acuan, bukan alasan utama."]}, {"cat": "Kewirausahaan", "q": "Perencanaan sekolah yang sistematis menuntut kepala sekolah bertindak sebagai perencana (planner) yang mahir dalam mengurutkan skala prioritas. Bagaimana kapasitas pimpinan dalam merancang kurikulum interdisipliner mampu menjamin kedalaman pemahaman siswa?", "opts": ["Perencanaan kurikulum difokuskan pada pemetaan kompetensi lintas mata pelajaran yang saling terkait dalam proyek bersama.", "Pimpinan merancang jadwal kolaborasi antar-guru untuk mengintegrasikan konsep-konsep kunci dari berbagai disiplin ilmu.", "Fokus perencanaan adalah mengalokasikan waktu yang cukup bagi siswa untuk melakukan eksplorasi mendalam atas suatu topik.", "Pimpinan menginstruksikan penggunaan pendekatan tematik yang menghubungkan berbagai bidang ilmu dalam konteks nyata.", "Strategi perencanaan memfasilitasi kolaborasi antar-guru untuk membangun kerangka mental yang menghubungkan konsep."], "a": 4, "e": "Strategi perencanaan yang memfasilitasi kolaborasi antar-guru membangun kerangka mental yang menghubungkan konsep, dasar kedalaman pemahaman siswa dalam kurikulum interdisipliner.", "w": ["Pemetaan kompetensi lintas mapel baru tahap administratif perencanaan.", "Jadwal kolaborasi antar-guru adalah teknis pelaksanaan.", "Alokasi waktu eksplorasi mendukung kedalaman, tetapi bukan inti kurikulum interdisipliner.", "Instruksi pendekatan tematik bersifat perintah tanpa kolaborasi guru.", null]}, {"cat": "Kewirausahaan", "q": "Budaya mutu ditekankan pada kondisi dinamis yang senantiasa berupaya memenuhi atau melampaui harapan pemangku kepentingan pendidikan. Sejauh mana implementasi budaya mutu berbasis kewirausahaan mendukung tercapainya dimensi \"Kewargaan\" dalam profil lulusan?", "opts": ["Budaya mutu diarahkan untuk menciptakan program pengabdian masyarakat yang melibatkan siswa dalam pemecahan masalah warga.", "Komitmen terhadap mutu mendorong inisiatif kolaboratif yang melatih tanggung jawab sosial dalam menyelesaikan masalah.", "Inovasi layanan sekolah difokuskan pada pengembangan karakter kepedulian sosial melalui proyek-proyek kemanusiaan.", "Pimpinan menggunakan standar mutu untuk membangun kemitraan dengan lembaga sosial guna memperkaya pengalaman siswa.", "Fokus utama budaya mutu adalah menciptakan lulusan yang memiliki empati dan kesadaran akan isu-isu kemasyarakatan."], "a": 1, "e": "Komitmen pada mutu mendorong inisiatif kolaboratif yang melatih tanggung jawab sosial dalam menyelesaikan masalah; ini menumbuhkan dimensi kewargaan lewat proses.", "w": ["Program pengabdian masyarakat adalah salah satu kegiatan, bukan dampak budaya mutu.", null, "Proyek kemanusiaan berfokus pada kegiatan tertentu.", "Kemitraan dengan lembaga sosial bersifat eksternal dan fasilitatif.", "Lulusan berempati adalah hasil, bukan cara budaya mutu bekerja."]}, {"cat": "Kewirausahaan", "q": "Aktivator dalam pembelajaran mendalam berperan menstimulasi peserta didik untuk mencapai level pencapaian yang lebih tinggi melalui umpan balik. Bagaimana peran kepala sekolah sebagai aktivator kewirausahaan mampu mencegah terjadinya penurunan daya imajinasi (brain rot) pada siswa?", "opts": ["Pimpinan melarang penggunaan perangkat digital yang bersifat pasif dan mendorong penggunaan teknologi untuk kreasi, bukan konsumsi.", "Fokus pimpinan adalah merancang pembelajaran berbasis proyek yang menantang imajinasi dan pemecahan masalah orisinal.", "Pimpinan mewajibkan adanya sesi refleksi dan ekspresi artistik sebagai keseimbangan dari aktivitas digital sehari-hari.", "Kepemimpinan digital yang bijak mengarahkan teknologi untuk mengasah kepekaan estetika, empati, dan berpikir abstrak.", "Aktivator digital memprioritaskan pengembangan literasi media kritis sehingga siswa mampu memilah dan memaknai informasi."], "a": 3, "e": "Kepemimpinan digital bijak mengarahkan teknologi mengasah kepekaan estetika, empati, dan berpikir abstrak; hal ini menjaga imajinasi dari brain rot.", "w": ["Melarang perangkat pasif bersifat pembatasan, bukan aktivasi.", "Proyek menantang imajinasi berfokus pada strategi pembelajaran, bukan kepemimpinan digital.", "Sesi refleksi dan ekspresi artistik sekadar penyeimbang aktivitas digital.", null, "Literasi media kritis menyoal informasi, bukan daya imajinasi."]}, {"cat": "Kewirausahaan", "q": "Manajemen perubahan menuju organisasi pembelajar mengharuskan pemimpin untuk meningkatkan kompetensi sumber daya manusia secara sistemis. Bagaimana pengelolaan perubahan yang dipimpin kepala sekolah mampu mentransformasi sekolah menjadi entitas pembelajar sepanjang hayat?", "opts": ["Pimpinan memfasilitasi forum refleksi kolaboratif tempat pendidik berbagi praktik baik dan solusi atas hambatan nyata.", "Transformasi dilakukan melalui penyusunan program pengembangan profesional yang berkelanjutan dan partisipatif.", "Fokus pengelolaan perubahan adalah menciptakan budaya belajar bersama dalam komunitas praktik antar-guru.", "Pimpinan menetapkan sistem mentoring dan coaching yang memberdayakan guru senior untuk membimbing rekan lain.", "Perubahan organisasi diarahkan untuk membangun ekosistem yang terbuka terhadap inovasi dan umpan balik perbaikan."], "a": 0, "e": "Forum refleksi kolaboratif tempat pendidik berbagi praktik baik dan mengatasi hambatan nyata membangun budaya belajar sepanjang hayat di organisasi.", "w": [null, "Program pengembangan profesional partisipatif masih berupa perencanaan program.", "Komunitas praktik adalah bentuk umum tanpa mekanisme konkret pengelolaan perubahan.", "Mentoring dan coaching menekankan hubungan senior-junior.", "Ekosistem terbuka terhadap inovasi terlalu umum."]}, {"cat": "Kewirausahaan", "q": "Pengambilan keputusan manajerial menuntut keseimbangan antara pendekatan rasional berbasis data dan pendekatan intuitif hasil pengalaman. Mengapa sinergi kedua pendekatan ini dalam kepemimpinan kewirausahaan menjadi prasyarat bagi visi sekolah masa depan?", "opts": ["Keseimbangan tersebut bertujuan untuk menghasilkan keputusan yang tidak hanya efisien secara teknis tetapi juga humanis.", "Fokus sinergi ini adalah memadukan bukti empiris dengan kearifan lokal yang berkembang di masyarakat sekolah.", "Sinergi digunakan pimpinan untuk mengakomodasi kompleksitas masalah pendidikan yang tidak dapat dijawab oleh data semata.", "Pimpinan mengutamakan pengambilan keputusan partisipatif yang melibatkan data dan pengalaman kolektif warga sekolah.", "Sinergi memperkuat akurasi keputusan strategis melalui integrasi analisis risiko logis dan kearifan yang menghargai fitrah."], "a": 4, "e": "Sinergi rasional dan intuitif memperkuat akurasi keputusan strategis dengan analisis risiko logis dan kearifan yang menghargai fitrah, alasan prasyarat visi sekolah masa depan.", "w": ["Keputusan efisien dan humanis merupakan manfaat, bukan alasan strategis.", "Memadukan bukti empiris dan kearifan lokal menyempitkan ke konteks lokal.", "Mengakomodasi kompleksitas benar tetapi tidak menjelaskan kaitan visi masa depan.", "Keputusan partisipatif adalah gaya pengambilan keputusan, bukan sinergi rasional-intuitif.", null]}, {"cat": "Kewirausahaan", "q": "Komunikasi organisasi yang efektif melibatkan pertukaran hasrat dan makna untuk mencapai kesamaan pemahaman antar-individu. Bagaimana efektivitas komunikasi kewirausahaan kepala sekolah dengan orang tua mampu mendukung implementasi assessment as learning di rumah?", "opts": ["Komunikasi difokuskan pada pemberian pemahaman bahwa nilai angka bukan satu-satunya indikator keberhasilan anak.", "Pimpinan menggunakan platform digital untuk berbagi contoh-contoh refleksi mandiri yang dapat dilakukan orang tua di rumah.", "Komunikasi diarahkan untuk membangun kesepahaman tentang pentingnya umpan balik kualitatif dalam tumbuh kembang anak.", "Pimpinan membuka ruang dialog rutin antara orang tua dan guru untuk membahas strategi pendampingan belajar di rumah.", "Dialog partisipatif memampukan orang tua memahami urgensi refleksi mandiri anak dalam mengenali progres belajarnya."], "a": 4, "e": "Dialog partisipatif memampukan orang tua memahami urgensi refleksi mandiri anak dalam mengenali progres belajarnya, inti assessment as learning di rumah.", "w": ["Nilai bukan satu-satunya indikator baru sebatas pemahaman umum.", "Platform digital adalah sarana penyebaran contoh, bukan pemahaman mendalam.", "Umpan balik kualitatif berkaitan dengan asesmen, bukan refleksi mandiri anak.", "Dialog rutin orang tua-guru membahas strategi pendampingan, tanpa menyoroti refleksi diri anak.", null]}, {"cat": "Kewirausahaan", "q": "Prinsip Kaizen atau perbaikan terus-menerus menekankan bahwa tidak ada sistem yang sempurna karena selalu ada celah untuk peningkatan mutu. Bagaimana penerapan prinsip ini mampu mendukung transisi hasil belajar siswa ke level Extended Abstract dalam taksonomi SOLO?", "opts": ["Prinsip Kaizen diarahkan untuk memastikan siswa terus-menerus mendapatkan tantangan yang meningkatkan kompleksitas berpikir.", "Komitmen pada perbaikan mendorong tantangan yang memotivasi siswa untuk menggeneralisasi ide ke dalam konteks baru.", "Fokus pimpinan dalam Kaizen adalah menciptakan siklus refleksi dan revisi berkelanjutan pada setiap produk karya siswa.", "Pimpinan menggunakan prinsip ini untuk mengembangkan kemampuan transfer pengetahuan lintas situasi pada diri siswa.", "Kaizen dipahami sebagai proses iteratif dalam pembelajaran yang mendorong siswa mencapai pemahaman yang lebih dalam."], "a": 1, "e": "Komitmen pada perbaikan berkelanjutan mendorong tantangan yang memotivasi siswa menggeneralisasi ide ke konteks baru, ciri Extended Abstract dalam taksonomi SOLO.", "w": ["Tantangan berkompleksitas meningkat lebih mengarah ke level relasional.", null, "Siklus refleksi dan revisi menekankan perbaikan produk, bukan generalisasi.", "Transfer lintas situasi mirip, tetapi tidak dikaitkan dengan komitmen perbaikan.", "Proses iteratif menuju pemahaman lebih dalam masih umum."]}, {"cat": "Kewirausahaan", "q": "Kewirausahaan dalam bidang pendidikan (edupreneurship) memiliki makna sosial untuk kepentingan peningkatan mutu layanan bagi siswa. Sejauh mana kepemimpinan edupreneurship mampu menjamin terwujudnya keadilan sosial dalam akses teknologi?", "opts": ["Edupreneurship memprioritaskan alokasi teknologi berdasarkan tingkat kebutuhan dan kesiapan setiap individu tanpa diskriminasi.", "Keberhasilan inovasi bisnis sekolah diukur berdasarkan peningkatan literasi digital seluruh warga, bukan sekadar kepemilikan perangkat.", "Fokus edupreneurship adalah mengembangkan platform belajar yang dapat diakses oleh semua siswa dari berbagai latar belakang ekonomi.", "Manajemen sumber daya memastikan pendistribusian infrastruktur informasi dilakukan berdasarkan analisis kebutuhan riil.", "Pimpinan mengarahkan unit usaha untuk menyubsidi akses teknologi bagi siswa kurang mampu melalui program beasiswa digital."], "a": 3, "e": "Pendistribusian infrastruktur informasi berdasarkan analisis kebutuhan riil memastikan keadilan sosial dalam akses teknologi lewat pengelolaan sumber daya yang tepat sasaran.", "w": ["Alokasi berdasarkan kesiapan individu berpotensi diskriminatif.", "Ukuran literasi digital adalah hasil, bukan jaminan keadilan akses.", "Platform belajar yang dapat diakses semua tidak memastikan tersedianya perangkat.", null, "Subsidi unit usaha menyempit pada satu mekanisme dan bukan manajemen sumber daya."]}, {"cat": "Kewirausahaan", "q": "Pemimpin yang bertindak sebagai ahli memiliki kemampuan besar dalam belajar dan membelajarkan timnya secara terus-menerus. Bagaimana kapasitas ini membantu guru dalam mengidentifikasi materi esensial yang memfasilitasi pendalaman pengetahuan?", "opts": ["Keahlian pemimpin digunakan untuk memfasilitasi lokakarya identifikasi konsep kunci yang perlu dikuasai secara mendalam.", "Kapasitas ini memandu pendidik untuk memahami inti disiplin ilmu dan menghubungkannya dengan isu nyata agar fungsional.", "Pimpinan menugaskan guru untuk melakukan pemetaan kompetensi esensial secara kolaboratif lintas mata pelajaran.", "Fokus keahlian pimpinan adalah membimbing guru dalam menyusun peta konsep dan big ideas dari setiap bidang studi.", "Pimpinan mewajibkan setiap guru untuk mengidentifikasi pengetahuan inti yang relevan dengan perkembangan zaman dan kebutuhan siswa."], "a": 0, "e": "Keahlian pemimpin dipakai memfasilitasi lokakarya identifikasi konsep kunci yang perlu dikuasai secara mendalam, membantu guru menentukan materi esensial.", "w": [null, "Memandu memahami inti disiplin ilmu bersifat umum, tanpa tindakan pemimpin.", "Pemetaan kompetensi lintas mapel adalah penugasan administratif.", "Menyusun peta konsep dan big ideas adalah teknik, bukan fasilitasi bersama.", "Mewajibkan guru mengidentifikasi sendiri tidak menunjukkan kapasitas keahlian pemimpin."]}, {"cat": "Kewirausahaan", "q": "Organisasi yang sukses ditandai dengan kepemimpinan yang tersebar dan kerja sama tim yang kompak melalui pendelegasian wewenang. Bagaimana pola kepemimpinan demokratis dan terbuka tersebut mampu memperkuat dimensi \"Kemandirian\" pada siswa?", "opts": ["Kepemimpinan terbuka diartikan sebagai pemberian ruang partisipasi bagi siswa dalam merancang aturan dan program sekolah.", "Fokus pimpinan adalah menumbuhkan rasa memiliki dan tanggung jawab siswa melalui keterlibatan dalam pengambilan keputusan.", "Pimpinan mewajibkan adanya organisasi siswa yang berfungsi sebagai mitra sekolah dalam mengelola kegiatan pembelajaran.", "Kepemimpinan demokratis digunakan untuk melatih siswa menyuarakan pendapat, bernegosiasi, dan mengambil inisiatif secara mandiri.", "Ruang partisipatif memberikan peluang bagi siswa untuk secara aktif menentukan tujuan dan memantau kemajuan belajarnya."], "a": 4, "e": "Ruang partisipatif yang memungkinkan siswa menentukan tujuan dan memantau kemajuan belajarnya adalah wujud langsung kemandirian.", "w": ["Ruang partisipasi merancang aturan bersifat kolektif, bukan kemandirian belajar individu.", "Rasa memiliki dan tanggung jawab dalam keputusan mengarah ke tanggung jawab kolektif.", "Organisasi siswa sebagai mitra sekolah bersifat kelembagaan.", "Melatih menyuarakan pendapat menguatkan komunikasi, bukan pengelolaan belajar sendiri.", null]}, {"cat": "Profesional", "q": "Kepemimpinan Pendidikan 5.0 menekankan pada model kepemimpinan yang mengintegrasikan kecerdasan digital dengan kecerdasan emosional, spiritual, dan sosial untuk membangun ekosistem yang inklusif. Dalam kerangka Pembelajaran Mendalam, prinsip \"Memuliakan\" menuntut penghargaan terhadap martabat dan potensi fitrah setiap individu di sekolah. Bagaimana korelasi strategis antara visi digital kepala sekolah dengan implementasi prinsip memuliakan dalam upaya mentransformasi budaya belajar di era disrupsi?", "opts": ["Visi digital pemimpin sekolah difokuskan pada penguatan kapasitas sumber daya manusia melalui pelatihan etika dan empati berbasis teknologi.", "Implementasi teknologi diposisikan sebagai instrumen untuk memperkuat kemanusiaan, kolaborasi, dan penghargaan terhadap keunikan potensi setiap peserta didik.", "Kepala sekolah menyelaraskan digitalisasi kurikulum dengan nilai-nilai lokal dan kebutuhan individual siswa melalui pendekatan partisipatif.", "Penggunaan teknologi cerdas diarahkan untuk membuka ruang eksplorasi siswa selaras dengan target pencapaian akademik yang fleksibel dan humanis.", "Pemanfaatan teknologi dilakukan untuk meningkatkan interaksi sosial dan emosional antarwarga sekolah dalam bingkai pembelajaran berdiferensiasi."], "a": 1, "e": "Teknologi diposisikan sebagai instrumen memperkuat kemanusiaan, kolaborasi, dan penghargaan pada keunikan setiap peserta didik: inilah korelasi visi digital dengan prinsip memuliakan.", "w": ["Pelatihan etika dan empati berbasis teknologi menyempit pada program pelatihan SDM.", null, "Digitalisasi kurikulum selaras nilai lokal tidak menyoroti korelasi visi digital dengan memuliakan.", "Eksplorasi selaras target akademik fleksibel menjadikan akademik sebagai tolok ukur.", "Teknologi untuk interaksi sosial-emosional bersifat sempit dan tidak menyentuh martabat individu."]}, {"cat": "Profesional", "q": "Keterampilan sense-making dalam kepemimpinan adaptif diperlukan untuk memberikan makna pada gejala perubahan kebijakan yang sangat dinamis dan penuh ketidakpastian. Prinsip \"Bermakna\" dalam Pembelajaran Mendalam menggarisbawahi pentingnya keterkaitan antara pengetahuan baru dengan pengalaman sebelumnya agar pembelajaran menjadi relevan dengan kehidupan nyata. Sejauh mana kapasitas kepala sekolah dalam melakukan sense-making berkontribusi pada penciptaan kurikulum sekolah yang bermakna bagi peserta didik?", "opts": ["Pemimpin sekolah memfasilitasi guru dalam memaknai perubahan kebijakan secara kolaboratif untuk menyusun kurikulum yang kontekstual.", "Keterampilan ini memampukan pimpinan untuk menyeleksi dan memaknai inovasi yang paling relevan dengan karakteristik serta kebutuhan nyata komunitas sekolah.", "Sense-making diarahkan untuk mengintegrasikan kurikulum nasional dengan potensi lokal melalui dialog terbuka dengan warga sekolah.", "Kapasitas ini digunakan pimpinan untuk membangun pemahaman bersama tentang esensi pengetahuan yang fungsional bagi kehidupan siswa.", "Fokus utama pimpinan adalah mempercepat adopsi inovasi sambil tetap mempertimbangkan kesiapan literasi digital dan nilai kearifan lokal sekolah."], "a": 3, "e": "Sense-making dipakai membangun pemahaman bersama tentang esensi pengetahuan yang fungsional bagi kehidupan siswa, sehingga kurikulum menjadi bermakna.", "w": ["Memaknai perubahan kebijakan bersifat teknis-kebijakan, belum menyentuh kebermaknaan pengetahuan bagi siswa.", "Menyeleksi inovasi relevan berfokus pada seleksi inovasi.", "Integrasi kurikulum nasional dan potensi lokal fokus pada kontekstualisasi, bukan makna fungsional.", null, "Mempercepat adopsi inovasi menekankan kecepatan, bertentangan dengan pemaknaan mendalam."]}, {"cat": "Profesional", "q": "Kepala sekolah dalam era 5.0 memiliki peran strategis sebagai \"Aktivator\" yang menstimulasi motivasi intrinsik guru untuk melakukan inovasi pedagogik yang berdampak. Dalam Pembelajaran Mendalam, guru sebagai aktivator bertugas memberikan umpan balik konstruktif yang memicu pencapaian level kompetensi peserta didik yang lebih tinggi. Bagaimana pergeseran peran kepala sekolah dari pengawas administratif menjadi aktivator memengaruhi kualitas implementasi strategi scaffolding dalam supervisi akademik?", "opts": ["Peran aktivator membuka ruang otonomi profesional guru dengan pendampingan yang disesuaikan dengan tingkat kompetensi masing-masing.", "Aktivator pembelajaran menekankan pada pemberian bantuan yang bersifat sementara dan menurun secara bertahap untuk membangun kemandirian guru.", "Kepala sekolah memberikan dukungan terukur berdasarkan tingkat kompetensi guru guna membangun kemandirian profesional dan kedalaman praktik pedagogis.", "Supervisi akademik difokuskan pada pengembangan kemampuan refleksi guru melalui umpan balik yang membangun tanpa menghakimi.", "Pemimpin sekolah memfasilitasi komunitas belajar guru untuk saling memberikan scaffolding secara horizontal."], "a": 4, "e": "Pemimpin yang aktivator memfasilitasi komunitas belajar guru untuk saling memberi scaffolding secara horizontal, sehingga dukungan tidak hanya hierarkis.", "w": ["Otonomi profesional dengan pendampingan sesuai kompetensi bersifat umum dan tidak spesifik pada aktivator.", "Bantuan sementara yang menurun bertahap hanya mendefinisikan scaffolding.", "Dukungan terukur sesuai kompetensi hanya mengulang definisi scaffolding.", "Refleksi dan umpan balik tanpa menghakimi hanya salah satu teknik supervisi.", null]}, {"cat": "Profesional", "q": "Teori kepemimpinan kompleksitas menyarankan penciptaan adaptive space sebagai ruang dinamis untuk interaksi lintas fungsi dan eksperimen ide baru. Prinsip \"Menggembirakan\" (joyful) dalam PM menekankan pada terciptanya tantangan yang memotivasi dan tercapainya AHA moment melalui suasana belajar yang inspiratif. Bagaimana fungsi adaptive space yang diciptakan kepala sekolah mampu menumbuhkan lingkungan pembelajaran yang menggembirakan bagi seluruh komunitas sekolah?", "opts": ["Ruang adaptif berfungsi untuk memfasilitasi kolaborasi ide antar-unit kerja tanpa takut salah, sehingga tumbuh keberanian bereksperimen.", "Penciptaan ruang dinamis memfasilitasi terjadinya dialog partisipatif dan keberanian mengambil risiko intelektual yang memicu inovasi serta kepuasan belajar.", "Adaptive space digunakan untuk mengakomodasi perbedaan gaya belajar dan kecepatan pemahaman siswa dalam suasana yang mendukung.", "Ruang ini memberi kesempatan bagi guru dan siswa untuk merancang proyek bersama yang menantang namun menyenangkan.", "Fokus utama dari ruang adaptif adalah meningkatkan keterlibatan aktif seluruh warga sekolah melalui refleksi dan apresiasi terhadap proses."], "a": 2, "e": "Adaptive space mengakomodasi perbedaan gaya belajar dan kecepatan pemahaman dalam suasana suportif; siswa merasa dihargai dan belajar dengan gembira.", "w": ["Kolaborasi ide antar-unit kerja lebih menekankan interaksi pengelola, bukan kegembiraan belajar.", "Dialog partisipatif dan risiko intelektual menekankan proses inovasi organisasi.", null, "Proyek bersama yang menantang tetapi menyenangkan hanya salah satu bentuk kegiatan.", "Meningkatkan keterlibatan lewat refleksi dan apresiasi bersifat proses, bukan pengakomodasian perbedaan."]}, {"cat": "Profesional", "q": "Kepemimpinan berkelanjutan menuntut pengambilan tindakan bijaksana yang mempertimbangkan kebutuhan pendidikan generasi masa depan tanpa mengorbankan pelestarian nilai dasar. Pemanfaatan teknologi digital dalam kerangka PM diposisikan
