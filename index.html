sebagai katalisator untuk menciptakan pembelajaran yang interaktif dan kontekstual. Mengapa integrasi visi kepemimpinan berkelanjutan menjadi krusial dalam pengelolaan sumber daya teknologi digital di satuan pendidikan?", "opts": ["Visi ini memastikan bahwa teknologi digital dimanfaatkan untuk memperkuat literasi dan karakter siswa sebagai pembelajar sepanjang hayat yang resilien.", "Kepemimpinan berkelanjutan mendorong penggunaan teknologi secara proporsional antara inovasi dan pelestarian nilai moral.", "Integrasi tersebut bertujuan untuk menciptakan keseimbangan antara efisiensi digital dan pengembangan empati sosial.", "Fokus pimpinan adalah menjamin bahwa teknologi melayani kebutuhan pedagogis, bukan sebaliknya.", "Kepemimpinan berkelanjutan mengedepankan pengambilan keputusan teknologi berbasis dampak jangka panjang terhadap kualitas hidup manusia."], "a": 0, "e": "Visi berkelanjutan memastikan teknologi digital memperkuat literasi dan karakter siswa sebagai pembelajar sepanjang hayat yang resilien, sejalan dengan tujuan jangka panjang.", "w": [null, "Penggunaan proporsional teknologi dan moral hanya menyatakan keseimbangan.", "Keseimbangan efisiensi digital dan empati sosial masih umum.", "Teknologi melayani pedagogi merupakan prinsip, bukan alasan mengapa visi berkelanjutan krusial.", "Keputusan berbasis dampak jangka panjang benar, tetapi tidak menyentuh dampak pada siswa."]}, {"cat": "Profesional", "q": "Kepemimpinan kolaboratif menggeser paradigma kontrol pimpinan menjadi fasilitasi kemitraan yang solid antara sekolah, keluarga, dan masyarakat. Kerangka PM pada elemen \"Kemitraan Pembelajaran\" menekankan pada perpindahan kontrol pembelajaran dari guru saja menjadi kolaborasi inkuiri bersama. Bagaimana efektivitas kepemimpinan kolaboratif kepala sekolah mampu memperkuat dimensi \"Kewargaan\" dalam profil lulusan Pembelajaran Mendalam?", "opts": ["Kolaborasi yang dinamis memungkinkan peserta didik berinteraksi langsung dengan isu nyata di masyarakat sehingga menumbuhkan empati dan tanggung jawab sosial.", "Pemimpin sekolah memfasilitasi proyek bersama antara siswa, orang tua, dan masyarakat untuk memecahkan masalah lingkungan sekitar.", "Kemitraan pembelajaran dirancang sebagai wadah partisipasi aktif warga dalam proses pendidikan yang saling menguatkan.", "Kepala sekolah membangun jejaring dengan berbagai pihak untuk memperkaya pengalaman belajar siswa secara kontekstual.", "Fokus utama kemitraan adalah menciptakan ruang dialog yang setara antara sekolah, keluarga, dan masyarakat demi tujuan pendidikan bersama."], "a": 3, "e": "Membangun jejaring dengan berbagai pihak memperkaya pengalaman belajar siswa secara kontekstual, gambaran kepemimpinan kolaboratif dalam kemitraan pembelajaran.", "w": ["Interaksi langsung siswa dengan isu nyata menekankan hasil di siswa, bukan peran kepemimpinan kolaboratif.", "Proyek lingkungan bersama adalah bentuk kegiatan spesifik.", "Wadah partisipasi warga menekankan partisipasi, bukan jejaring pembelajaran.", null, "Ruang dialog setara adalah tujuan komunikasi, bukan penguatan kewargaan langsung."]}, {"cat": "Profesional", "q": "Kepemimpinan instruksional di era digital menuntut kapasitas pimpinan untuk mengawal kualitas proses humanisasi melalui desain kurikulum yang adaptif. Pengalaman belajar dalam PM dirancang melalui tahapan \"Memahami\", \"Mengaplikasi\", dan \"Merefleksi\" yang dilakukan secara holistik. Bagaimana peran kepala sekolah sebagai pemimpin instruksional dalam memastikan sinkronisasi antara capaian pembelajaran dengan pertumbuhan karakter peserta didik?", "opts": ["Pimpinan memfasilitasi guru dalam merumuskan tujuan pembelajaran yang mengintegrasikan pengetahuan aplikatif dengan internalisasi nilai moral dan etika.", "Kepala sekolah membimbing guru untuk merancang asesmen yang mengukur kompetensi kognitif sekaligus karakter.", "Peran instruksional pimpinan difokuskan pada pengembangan perangkat ajar yang menyatukan konten dan nilai.", "Pemimpin sekolah mendorong adanya proyek lintas disiplin yang mengasah nalar kritis sekaligus kepekaan sosial.", "Fokus utama pimpinan adalah menciptakan budaya refleksi bersama antara guru dan siswa tentang keterkaitan ilmu dan etika."], "a": 4, "e": "Budaya refleksi bersama guru dan siswa tentang keterkaitan ilmu dan etika menyinkronkan capaian pembelajaran dengan karakter, sesuai tahap merefleksi.", "w": ["Merumuskan tujuan yang memuat nilai moral adalah aspek perencanaan.", "Asesmen kognitif dan karakter adalah aspek penilaian.", "Perangkat ajar yang menyatukan konten dan nilai adalah aspek dokumen.", "Proyek lintas disiplin adalah bentuk kegiatan.", null]}, {"cat": "Profesional", "q": "Sinergi antara kecerdasan emosional (EQ) dan etika merupakan fondasi utama kepemimpinan 5.0 yang memanusiakan pendidikan. Pembelajaran Mendalam bertujuan menghasilkan pribadi yang memiliki kompetensi utuh dan seimbang antara aspek intelektual, spiritual, dan fisik sesuai fitrahnya. Bagaimana internalisasi EQ dan etika kepemimpinan kepala sekolah memengaruhi iklim psikososial yang mendukung pertumbuhan kompetensi utuh tersebut?", "opts": ["Kematangan emosional pimpinan membantu menciptakan lingkungan belajar yang aman dan penuh empati, sehingga motivasi intrinsik siswa tumbuh optimal.", "Kepala sekolah yang memiliki EQ tinggi mampu menjadi teladan dalam mengelola konflik dan membangun rasa saling percaya.", "Penerapan etika kepemimpinan mendorong terciptanya iklim yang menghargai keberagaman potensi siswa.", "Fokus utama pimpinan adalah membangun hubungan yang hangat dan suportif dengan seluruh warga sekolah.", "Kepemimpinan berbasis EQ memprioritaskan komunikasi yang mendengarkan dan memberdayakan setiap individu."], "a": 1, "e": "EQ tinggi membuat kepala sekolah menjadi teladan dalam mengelola konflik dan membangun rasa saling percaya, sehingga iklim psikososial sehat bagi kompetensi utuh.", "w": ["Lingkungan aman dan empati mengarah pada dampak ke siswa.", null, "Etika yang menghargai keberagaman potensi mengarah pada kebijakan, bukan EQ pemimpin.", "Hubungan hangat adalah gaya hubungan yang bersifat umum.", "Komunikasi yang mendengarkan adalah keterampilan spesifik."]}, {"cat": "Profesional", "q": "Evaluasi program dalam manajemen sekolah modern harus bergeser dari sekadar pengukuran luaran (output) menuju pemaknaan terhadap proses transformasi. Asesmen dalam PM menekankan pada assessment as learning yang melibatkan penilaian diri dan penilaian sejawat untuk membangun regulasi diri. Sejauh mana kebijakan kepala sekolah terkait transformasi asesmen mampu mengubah budaya belajar peserta didik menjadi lebih mandiri?", "opts": ["Kebijakan asesmen autentik mendorong siswa untuk menyadari proses berpikirnya sendiri, mengevaluasi strategi belajarnya, dan menentukan tindak lanjut kemajuan.", "Kepala sekolah memfasilitasi pelatihan guru dalam merancang asesmen diri dan portofolio reflektif.", "Transformasi asesmen menempatkan siswa sebagai subjek evaluasi yang aktif, bukan objek penilaian.", "Pemimpin sekolah membangun sistem asesmen yang memberikan ruang bagi siswa untuk menetapkan target belajar sendiri.", "Fokus kebijakan pimpinan adalah menjadikan umpan balik sebagai alat belajar, bukan hanya penentu nilai akhir."], "a": 2, "e": "Asesmen yang menempatkan siswa sebagai subjek evaluasi aktif, bukan objek penilaian, membangun regulasi diri dan kemandirian belajar (assessment as learning).", "w": ["Kebijakan asesmen autentik mengulang tujuan asesmen tanpa pergeseran peran siswa.", "Pelatihan guru merancang asesmen adalah langkah teknis.", null, "Target belajar sendiri adalah salah satu praktik, bukan perubahan paradigma.", "Umpan balik sebagai alat belajar penting, tetapi belum menyebut peran aktif siswa."]}, {"cat": "Profesional", "q": "Inovasi berbasis konteks lokal menuntut pemimpin pendidikan untuk mendorong strategi yang relevan dengan karakteristik masyarakat dan kebutuhan unik peserta didik. Pembelajaran Mendalam memfasilitasi penggunaan lingkungan sekitar sebagai sumber belajar bermakna untuk menyelesaikan permasalahan nyata. Bagaimana efektivitas inovasi kurikulum berbasis konteks lokal yang dipimpin kepala sekolah mampu menyiapkan generasi yang kompetitif secara global namun tetap berkarakter luhur?", "opts": ["Integrasi nilai kearifan lokal dalam proyek lintas disiplin ilmu memperkuat identitas diri dan kemampuan nalar kritis siswa dalam menghadapi tantangan masa depan.", "Kepala sekolah memfasilitasi kemitraan dengan tokoh budaya lokal untuk mengemas pembelajaran berbasis masalah nyata di masyarakat.", "Inovasi kurikulum lokal diintegrasikan ke dalam materi pelajaran inti dengan pendekatan proyek kolaboratif.", "Pemimpin sekolah mendorong guru untuk menggunakan fenomena lokal sebagai bahan ajar yang bermakna dan kontekstual.", "Fokus utama inovasi kurikulum lokal adalah menumbuhkan kebanggaan budaya sekaligus keterampilan berpikir tingkat tinggi."], "a": 3, "e": "Mendorong guru menggunakan fenomena lokal sebagai bahan ajar bermakna dan kontekstual adalah inovasi berbasis konteks lokal yang langsung menyiapkan siswa berkarakter dan kompetitif.", "w": ["Integrasi kearifan lokal dalam proyek lintas disiplin lebih umum dan tidak fokus pada peran pemimpin terhadap guru.", "Kemitraan dengan tokoh budaya bersifat fasilitasi eksternal.", "Inovasi kurikulum lokal dalam materi inti adalah mekanisme teknis.", null, "Kebanggaan budaya dan berpikir tingkat tinggi adalah hasil, bukan cara kerja inovasi."]}, {"cat": "Profesional", "q": "Pendekatan design thinking dalam kepemimpinan masa depan berfungsi untuk merancang kebijakan sekolah yang berpusat pada kebutuhan nyata pengguna. Bagaimana integrasi metode  design thinking dalam manajemen sekolah memfasilitasi implementasi pembelajaran multi/interdisiplin ilmu sebagai pilar utama Pembelajaran Mendalam?", "opts": ["Membangun kerangka kerja organisasi yang memungkinkan pendidik berkolaborasi lintas disiplin untuk memecahkan permasalahan nyata yang dihadapi peserta didik.", "Kepala sekolah memfasilitasi lokakarya kolaboratif antara guru berbagai mata pelajaran untuk merancang proyek bersama.", "Metode design thinking digunakan untuk menggali aspirasi siswa dan orang tua dalam penyusunan kurikulum lintas disiplin.", "Pemimpin sekolah mendorong terbentuknya tim pengajar lintas bidang yang secara reguler merancang pembelajaran terintegrasi.", "Fokus utama pimpinan adalah menciptakan prototipe kebijakan yang diuji coba bersama guru sebelum diterapkan secara luas."], "a": 0, "e": "Design thinking membangun kerangka kerja organisasi yang memungkinkan pendidik berkolaborasi lintas disiplin memecahkan masalah nyata peserta didik.", "w": [null, "Lokakarya kolaboratif adalah kegiatan sekali waktu.", "Menggali aspirasi siswa dan orang tua berfokus pada masukan, bukan lintas disiplin guru.", "Tim pengajar lintas bidang adalah struktur, bukan metode design thinking.", "Prototipe kebijakan berfokus pada proses uji, bukan pembelajaran interdisipliner."]}, {"cat": "Profesional", "q": "Kepemimpinan agile mengedepankan fleksibilitas dan adaptasi cepat terhadap perubahan lingkungan yang tidak terprediksi. Bagaimana penerapan agile leadership oleh kepala sekolah mendukung terciptanya atmosfer \"Berkesadaran\" (mindful) di mana peserta didik mampu meregulasi strategi belajarnya secara mandiri di tengah dinamika informasi?", "opts": ["Menciptakan lingkungan organisasi yang adaptif sehingga memberikan ruang bagi siswa untuk secara aktif menentukan tujuan dan memantau kemajuan belajarnya.", "Kepala sekolah mendorong guru untuk memberikan kepercayaan pada siswa dalam mengelola proses belajarnya sendiri.", "Pimpinan memfasilitasi adanya ruang refleksi rutin bagi siswa untuk mengevaluasi strategi belajarnya.", "Pemimpin sekolah mencontohkan sikap tanggap terhadap perubahan sambil tetap berpegang pada nilai-nilai luhur.", "Fokus utama pimpinan adalah membangun budaya di mana umpan balik dari siswa dihargai dan ditindaklanjuti."], "a": 4, "e": "Budaya di mana umpan balik siswa dihargai dan ditindaklanjuti menciptakan atmosfer berkesadaran: siswa menjadi subjek yang didengar dan meregulasi belajarnya.", "w": ["Lingkungan adaptif memang mendukung, tetapi terlalu umum bagi regulasi strategi belajar.", "Kepercayaan guru pada siswa mengelola belajar adalah sikap guru, bukan agile leadership.", "Ruang refleksi rutin adalah aktivitas siswa, bukan kepemimpinan agile.", "Sikap tanggap pemimpin pada perubahan tidak menyentuh regulasi belajar siswa.", null]}, {"cat": "Profesional", "q": "Paradigma human-centered innovation dalam era 5.0 menggeser orientasi organisasi dari sekadar bertahan hidup menjadi inovasi yang memuliakan manusia. Bagaimana gaya kepemimpinan yang berorientasi pada inovasi kemanusiaan mentransformasi pola komunikasi organisasi untuk memprioritaskan dimensi \"Komunikasi\" dan \"Empati\" dalam profil lulusan Pembelajaran Mendalam?", "opts": ["Mengembangkan pola interaksi horizontal dan dialogis yang memfasilitasi setiap warga sekolah untuk saling mendengarkan, berefleksi, dan menghargai ide-ide unik.", "Kepala sekolah menciptakan ruang aman bagi seluruh warga untuk menyampaikan gagasan tanpa takut dihakimi.", "Pemimpin mendorong penggunaan komunikasi yang empatik dalam setiap rapat dan interaksi sehari-hari.", "Fokus utama pimpinan adalah melatih pendidik dalam teknik komunikasi non-violent dan mendengarkan aktif.", "Transformasi komunikasi diarahkan untuk membangun budaya umpan balik yang konstruktif dan menghargai perbedaan."], "a": 2, "e": "Mendorong komunikasi empatik dalam setiap rapat dan interaksi sehari-hari menjadikan empati sebagai kebiasaan organisasi dan memberi teladan langsung bagi komunikasi dan empati.", "w": ["Pola horizontal dan dialogis bersifat struktur komunikasi umum.", "Ruang aman menyampaikan gagasan menekankan keamanan psikologis.", null, "Pelatihan komunikasi non-violent adalah program teknis.", "Budaya umpan balik konstruktif mengarah ke kualitas masukan, bukan empati."]}, {"cat": "Profesional", "q": "Kepemimpinan digital yang bijak menuntut kemampuan pimpinan untuk memastikan bahwa kemajuan teknologi tidak mereduksi kedalaman proses berpikir manusia. Mengapa kepemimpinan kepala sekolah harus mengintegrasikan elemen \"Olah Rasa\" untuk memastikan bahwa pemanfaatan digital tidak menyebabkan penurunan daya imajinasi atau brain rot pada peserta didik?", "opts": ["Sinergi kepemimpinan dan olah rasa memastikan teknologi digunakan untuk mengasah kepekaan estetika, empati, dan hubungan antarmanusia yang bermakna.", "Kepala sekolah mendorong penggunaan teknologi yang memperkaya pengalaman sensorik dan emosional siswa.", "Pemimpin memastikan bahwa aktivitas digital di sekolah selalu diimbangi dengan kegiatan refleksi dan apresiasi karya.", "Fokus utama pimpinan adalah merancang pembelajaran berbasis teknologi yang tetap mengutamakan sentuhan humanis.", "Integrasi olah rasa membuat siswa tidak hanya mahir digital tetapi juga peka terhadap nilai-nilai kemanusiaan."], "a": 1, "e": "Olah rasa membuat teknologi memperkaya pengalaman sensorik dan emosional siswa, sehingga imajinasi terjaga dan tidak dangkal seperti pada brain rot.", "w": ["Sinergi kepemimpinan dan olah rasa dengan kepekaan estetika terlalu umum.", null, "Aktivitas digital diimbangi refleksi dan apresiasi adalah pembatasan, bukan integrasi olah rasa.", "Pembelajaran teknologi yang tetap humanis terlalu umum.", "Kepekaan nilai kemanusiaan adalah hasil, bukan alasan integrasi olah rasa."]}, {"cat": "Profesional", "q": "Kapasitas sense-making memampukan pemimpin untuk memaknai perubahan zaman guna membimbing komunitas pendidikan merumuskan tindakan yang terarah. Bagaimana peran kepala sekolah dalam melakukan sense-making membantu guru mengidentifikasi \"Pengetahuan Esensial\" yang tetap relevan di tengah banjir informasi era 5.0?", "opts": ["Membimbing pendidik untuk memahami inti dari disiplin ilmu dan menghubungkannya dengan tantangan masa depan.", "Kepala sekolah memfasilitasi diskusi komunitas guru untuk memilah informasi yang paling esensial bagi siswa.", "Pemimpin mendorong guru untuk menyusun peta konsep pengetahuan esensial berbasis kebutuhan lokal dan global.", "Fokus utama pimpinan adalah membantu guru membedakan antara informasi yang bersifat sementara dan pengetahuan yang mendasar.", "Peran sense-making diarahkan untuk membangun kurikulum yang adaptif tanpa kehilangan identitas keilmuan."], "a": 0, "e": "Sense-making membimbing pendidik memahami inti disiplin ilmu dan menghubungkannya dengan tantangan masa depan, itulah pengetahuan esensial yang tetap relevan.", "w": [null, "Diskusi memilah informasi bersifat proses, tidak menunjukkan kriteria esensial.", "Peta konsep berbasis kebutuhan lokal-global hanya teknik.", "Membedakan informasi sementara dan mendasar hanya kriteria dasar.", "Kurikulum adaptif tanpa kehilangan identitas keilmuan berfokus pada kurikulum."]}, {"cat": "Profesional", "q": "Kepemimpinan transformasional di sekolah menekankan pada penggerakan motivasi intrinsik dan visi bersama untuk melampaui hasil standar. Bagaimana kepemimpinan tersebut mampu mengubah budaya asesmen sekolah dari pengukuran output kognitif menjadi fasilitasi assessment as learning (AAL) dalam kerangka Pembelajaran Mendalam?", "opts": ["Menginspirasi komunitas sekolah untuk menjadikan asesmen diri dan sejawat sebagai media refleksi yang membantu siswa memahami strategi belajarnya.", "Kepala sekolah mendorong guru untuk mendesain asesmen yang memberi ruang bagi siswa untuk menunjukkan proses berpikirnya.", "Pemimpin mencontohkan penggunaan refleksi dalam setiap kegiatan evaluasi di sekolah.", "Fokus utama pimpinan adalah mengubah paradigma bahwa kesalahan dalam belajar adalah sumber berharga untuk tumbuh.", "Transformasi asesmen diarahkan pada terciptanya budaya umpan balik yang membangun dan berkelanjutan."], "a": 3, "e": "Mengubah paradigma bahwa kesalahan adalah sumber berharga untuk tumbuh adalah inti budaya assessment as learning yang membuat siswa berani merefleksikan proses.", "w": ["Menginspirasi asesmen diri dan sejawat adalah mekanisme, bukan perubahan pola pikir.", "Desain asesmen yang menunjukkan proses berpikir adalah teknik.", "Pemimpin mencontohkan refleksi adalah teladan, bukan perubahan paradigma.", null, "Budaya umpan balik adalah komponen, bukan perubahan paradigma tentang kesalahan."]}, {"cat": "Profesional", "q": "Konsep resiliensi kepemimpinan yang lahir dari refleksi menghasilkan ketangguhan yang lentur dalam menghadapi krisis tanpa kehilangan arah etis. Mengapa kepemimpinan yang resilien menjadi prasyarat bagi tumbuhnya kemampuan \"Regulasi Diri\" pada peserta didik saat menghadapi hambatan belajar yang kompleks?", "opts": ["Karena keteladanan pemimpin dalam berefleksi memberikan rasa aman bagi siswa untuk mengevaluasi strategi belajarnya dan bangkit dari kegagalan.", "Kepala sekolah yang resilien menunjukkan bahwa kegagalan adalah bagian dari proses belajar, bukan akhir segalanya.", "Pemimpin yang tangguh secara emosional mampu menciptakan lingkungan yang mendukung siswa untuk mencoba lagi tanpa takut salah.", "Fokus utama pimpinan adalah membangun budaya di mana tantangan dipandang sebagai peluang untuk berkembang.", "Resiliensi kepemimpinan diwujudkan dalam kebijakan yang memberi ruang bagi siswa untuk mengambil risiko akademik."], "a": 2, "e": "Pemimpin yang tangguh secara emosional menciptakan lingkungan yang mendukung siswa mencoba lagi tanpa takut salah, syarat tumbuhnya regulasi diri saat menghadapi hambatan.", "w": ["Teladan refleksi memberi rasa aman, tetapi hanya menekankan evaluasi strategi.", "Kegagalan bagian dari proses belajar hanya pesan umum.", null, "Tantangan sebagai peluang adalah pola pikir, bukan alasan resiliensi menjadi prasyarat.", "Kebijakan ruang mengambil risiko adalah tindakan kebijakan."]}, {"cat": "Profesional", "q": "Kemitraan pembelajaran dalam ekosistem pendidikan 5.0 membangun kolaborasi inkuiri dinamis antara sekolah, keluarga, dan masyarakat luas. Bagaimana peranan kepala sekolah dalam mengelola kemitraan tersebut agar prinsip \"Bermakna\" (kontekstual) menjadi realitas dalam pengalaman belajar peserta didik?", "opts": ["Memfasilitasi jejaring kolaboratif yang memungkinkan siswa menerapkan pengetahuannya untuk menyelesaikan isu nyata yang ada di lingkungan sekitarnya.", "Kepala sekolah membangun kemitraan dengan berbagai pihak untuk menyediakan sumber belajar otentik bagi siswa.", "Pemimpin mendorong adanya proyek bersama sekolah-masyarakat yang relevan dengan kebutuhan lokal.", "Fokus utama kemitraan adalah menciptakan pengalaman belajar yang terhubung langsung dengan dunia nyata.", "Kolaborasi dinamis diarahkan untuk memperkaya kurikulum dengan problem solving berbasis komunitas."], "a": 1, "e": "Kemitraan dengan berbagai pihak yang menyediakan sumber belajar autentik menjadikan pembelajaran kontekstual, sehingga prinsip bermakna menjadi kenyataan.", "w": ["Jejaring untuk menerapkan pengetahuan pada isu nyata menekankan hasil di siswa.", null, "Proyek bersama sekolah-masyarakat adalah bentuk kegiatan.", "Pengalaman belajar terhubung dunia nyata adalah tujuan.", "Problem solving berbasis komunitas adalah isi kurikulum."]}, {"cat": "Profesional", "q": "Kepemimpinan berkelanjutan menuntut pengambilan tindakan bijaksana yang mempertimbangkan kesejahteraan lahir dan batin generasi masa depan. Bagaimana implementasi prinsip \"Memuliakan\" (fitrah) dalam visi kepemimpinan berkelanjutan menjamin bahwa inovasi sekolah selalu selaras dengan potensi unik setiap peserta didik?", "opts": ["Memastikan setiap kebijakan sekolah menghargai keunikan, potensi, dan kemandirian siswa dengan menciptakan lingkungan yang inklusif dan suportif.", "Kepala sekolah mendorong diferensiasi pembelajaran berbasis minat dan bakat siswa.", "Pemimpin merancang sistem yang memberi ruang bagi siswa untuk berkembang sesuai kodratnya.", "Fokus utama pimpinan adalah mengakomodasi keberagaman potensi melalui layanan pendidikan yang personal.", "Implementasi prinsip memuliakan diwujudkan dalam kebijakan yang berpihak pada pertumbuhan holistik siswa."], "a": 4, "e": "Prinsip memuliakan diwujudkan dalam kebijakan yang berpihak pada pertumbuhan holistik siswa, sehingga inovasi sekolah selaras potensi unik setiap peserta didik.", "w": ["Kebijakan menghargai keunikan dan lingkungan inklusif masih umum.", "Diferensiasi berbasis minat dan bakat menyempit ke satu aspek.", "Sistem berkembang sesuai kodrat masih abstrak.", "Layanan personal untuk keberagaman potensi berfokus pada layanan.", null]}, {"cat": "Profesional", "q": "Teori kepemimpinan kompleksitas menyarankan penggunaan adaptive space sebagai wahana interaksi untuk menghasilkan ide-ide inovatif dari tingkat bawah. Bagaimana pengelolaan adaptive space yang dipimpin kepala sekolah mampu mendorong siswa mencapai level Extended Abstract dalam Taksonomi SOLO?", "opts": ["Ruang dinamis memfasilitasi siswa untuk menggeneralisasi ide-ide baru dan menerapkannya ke dalam konteks atau domain ilmu lain yang lebih luas.", "Kepala sekolah menciptakan kesempatan bagi siswa untuk mengeksplorasi hubungan antar konsep lintas disiplin.", "Pemimpin mendorong adanya proyek penelitian mandiri yang menantang siswa untuk berpikir tingkat tinggi.", "Fokus utama pimpinan adalah memberi kebebasan akademik yang bertanggung jawab untuk menghasilkan karya orisinal.", "Adaptive space digunakan sebagai wadah untuk menguji ide-ide baru dan memperoleh umpan balik dari berbagai sudut pandang."], "a": 0, "e": "Ruang dinamis memfasilitasi siswa menggeneralisasi ide baru ke konteks atau domain lain, ciri Extended Abstract dalam Taksonomi SOLO.", "w": [null, "Mengeksplorasi hubungan antar konsep lintas disiplin adalah level relasional.", "Proyek penelitian mandiri adalah bentuk kegiatan, tidak spesifik Extended Abstract.", "Kebebasan akademik tanggung jawab adalah kondisi pendukung.", "Menguji ide dan memperoleh umpan balik adalah proses, bukan generalisasi ke domain lain."]}, {"cat": "Sosial", "q": "Sekolah Anda sedang melaksanakan proyek bermakna yang melibatkan observasi lingkungan di pasar tradisional sekitar, namun beberapa pedagang merasa terganggu dengan kehadiran banyak siswa yang melakukan wawancara di jam sibuk. Sebagai pemimpin yang harus menjaga kemitraan pembelajaran dengan masyarakat, Anda perlu mengambil keputusan strategis untuk menyelaraskan kepentingan akademik dan keharmonisan sosial. Bagaimana langkah komunikasi sosial yang paling efektif untuk mengatasi situasi tersebut tanpa membatasi pengalaman belajar nyata siswa?", "opts": ["Menghentikan sementara kegiatan observasi lapangan dan mengalihkan ke dalam sekolah, sambil menyusun ulang protokol observasi bersama perwakilan pedagang.", "Memberikan kompensasi materiil kepada pedagang yang terdampak dan mengundang mereka sebagai mitra pembelajaran dalam proyek sekolah berikutnya.", "Meminta guru pendamping membatasi jumlah siswa yang turun ke lapangan serta melatih siswa teknik wawancara yang menghormati waktu sibuk pedagang.", "Mengundang perwakilan pedagang ke sekolah untuk berdialog mengenai tujuan pembelajaran serta merancang bersama protokol interaksi yang saling memuliakan dan menguntungkan.", "Membuat surat edaran resmi kepada perangkat desa yang juga memuat rencana apresiasi publik bagi pedagang yang mendukung proyek belajar siswa."], "a": 3, "e": "Mengundang pedagang ke sekolah berdialog dan merancang bersama protokol interaksi yang saling memuliakan menyelaraskan kepentingan tanpa membatasi belajar nyata.", "w": ["Menghentikan observasi sementara membatasi pengalaman belajar nyata siswa.", "Kompensasi materiil tidak membangun pemahaman atau protokol bersama.", "Membatasi jumlah siswa dan melatih teknik wawancara sepihak tanpa mendengar pedagang.", null, "Surat edaran ke perangkat desa tidak berdialog langsung dengan pedagang."]}, {"cat": "Sosial", "q": "Dalam rapat koordinasi, sekelompok orang tua siswa menyatakan keberatan terhadap model asesmen portofolio dan jurnal reflektif yang dianggap kurang memberikan kepastian nilai numerik dibandingkan ujian konvensional. Sebagai kepala sekolah, Anda memahami bahwa transformasi menuju Pembelajaran Mendalam membutuhkan dukungan penuh dari ekosistem keluarga agar motivasi intrinsik siswa dapat tumbuh optimal. Bagaimana cara Anda membangun pemahaman bersama dengan orang tua mengenai urgensi asesmen yang berorientasi pada refleksi dan kemandirian ini?", "opts": ["Mengadakan workshop kemitraan yang melibatkan orang tua untuk melihat langsung bagaimana proses assessment as learning membantu anak mengenali progres belajarnya sendiri.", "Memberikan penjelasan mengenai regulasi kurikulum terbaru disertai contoh studi kasus sekolah lain yang berhasil bertransisi ke asesmen portofolio.", "Menambahkan porsi ujian tulis secara berkala sebagai \"jembatan\" sambil terus menguatkan refleksi sebagai kompetensi utama siswa.", "Menugaskan wali kelas untuk melaporkan nilai harian melalui aplikasi digital dan mengundang orang tua dalam sesi refleksi bersama siswa setiap akhir pekan.", "Membagikan brosur literatur pendidikan sekaligus mengadakan kunjungan orang tua ke sekolah yang telah mempraktikkan asesmen autentik secara konsisten."], "a": 0, "e": "Workshop kemitraan yang melibatkan orang tua melihat langsung assessment as learning membangun pemahaman bersama lewat pengalaman, bukan sekadar informasi.", "w": [null, "Penjelasan regulasi dan studi kasus bersifat satu arah.", "Menambah ujian tulis sebagai jembatan mengkompromikan prinsip asesmen.", "Pelaporan nilai harian kembali pada orientasi angka.", "Brosur dan kunjungan ke sekolah lain bersifat informatif dan kurang melibatkan aktif."]}, {"cat": "Sosial", "q": "Anda mengamati adanya polarisasi di ruang guru antara kelompok yang antusias menerapkan prinsip \"pembelajaran yang menggembirakan\" dan kelompok yang tetap memegang teguh disiplin kaku karena khawatir kualitas akademik akan menurun. Situasi ini mulai memengaruhi budaya belajar dan kerjasama tim di sekolah yang seharusnya menjadi model kolaboratif bagi para siswa. Langkah kepemimpinan apa yang paling tepat untuk memperkuat budaya belajar   yang inklusif di antara para pendidik tersebut?", "opts": ["Menetapkan prosedur yang mewajibkan semua guru menggunakan metode permainan, namun memberikan ruang adaptasi bertahap sesuai karakter mata pelajaran.", "Memfasilitasi forum berbagi praktik baik di mana kedua kelompok dapat saling berdiskusi mengenai kaitan antara suasana kelas positif dengan pencapaian “AHA moment”.", "Memberikan penghargaan bagi guru-guru yang paling progresif dalam berinovasi dan sekaligus mengundang guru senior menjadi mentor pengelolaan disiplin kelas.", "Mengadakan kegiatan outbound luar sekolah yang dirancang khusus untuk memecahkan studi kasus pengajaran bersama secara kolaboratif.", "Melakukan supervisi klinis dengan pendekatan coaching, bukan evaluasi, untuk menggali kearifan lokal dari metode konvensional yang masih relevan."], "a": 1, "e": "Forum berbagi praktik baik yang mempertemukan kedua kelompok membangun budaya belajar inklusif; kedua pihak saling belajar mengaitkan suasana positif dengan \"AHA moment\".", "w": ["Mewajibkan metode permainan bersifat paksaan.", null, "Penghargaan bagi yang progresif berpotensi memperlebar polarisasi.", "Outbound bersifat sesaat dan tidak menyentuh akar perbedaan pandangan.", "Supervisi coaching bernilai, tetapi bersifat individual, bukan menyatukan kedua kelompok."]}, {"cat": "Sosial", "q": "Sekolah Anda menerima siswa pindahan dengan kebutuhan khusus (difabel), namun fasilitas fisik sekolah belum sepenuhnya ramah terhadap kondisi tersebut dan beberapa warga sekolah menunjukkan keraguan akan efektivitas pembelajaran di kelas inklusif. Anda menyadari bahwa prinsip Pembelajaran Mendalam harus memuliakan setiap individu tanpa terkecuali melalui penciptaan lingkungan yang aman dan nyaman. Apa keputusan kepemimpinan yang paling mencerminkan sensitivitas sosial dan tanggung jawab profesional Anda?", "opts": ["Menempatkan siswa tersebut di kelas dengan guru yang paling sabar dan melibatkan siswa reguler dalam perancangan lingkungan belajar yang ramah.", "Meminta bantuan dari dinas sosial sekaligus membentuk tim inklusi sekolah yang terdiri dari guru, orang tua, dan siswa.", "Membimbing seluruh warga sekolah untuk melakukan refleksi kolektif mengenai nilai kemanusiaan dan keadilan dalam memberikan hak pendidikan yang setara bagi setiap anak.", "Fokus pada percepatan renovasi sarana fisik sekolah menggunakan dana darurat dan secara paralel mengadakan pelatihan kesadaran inklusi bagi seluruh staf.", "Menginstruksikan guru bimbingan konseling untuk mengarahkan siswa lainnya agar mau membantu rekan baru tersebut secara bergantian setiap hari."], "a": 2, "e": "Refleksi kolektif nilai kemanusiaan dan keadilan menumbuhkan sensitivitas sosial dari dalam warga sekolah sehingga inklusi tidak hanya administratif.", "w": ["Menempatkan siswa pada guru paling sabar terlalu bergantung pada individu.", "Bantuan dinas sosial dan tim inklusi bersifat struktural.", null, "Renovasi cepat dengan pelatihan bersifat teknis-fisik dan belum mengubah cara pandang.", "Menginstruksikan bimbingan konseling mengatur siswa membantu secara bergantian bersifat perintah."]}, {"cat": "Sosial", "q": "Di tengah upaya meningkatkan pemanfaatan teknologi digital sebagai katalisator pembelajaran, banyak staf administrasi merasa cemas bahwa digitalisasi sistem manajemen sekolah akan menggantikan peran mereka dan menyebabkan pengurangan tenaga kerja. Sebagai pemimpin, Anda harus memastikan bahwa kemajuan teknologi tetap berjalan selaras dengan prinsip memuliakan potensi manusia di dalam ekosistem sekolah. Bagaimana sikap terbuka dan tindakan komunikasi yang paling tepat Anda lakukan untuk merespons kecemasan staf tersebut?", "opts": ["Memberikan jaminan tertulis bahwa tidak akan ada pemutusan hubungan kerja dan mengajak staf merancang peta jalan digitalisasi bersama.", "Mengajak staf berdialog mengenai bagaimana teknologi digital dapat membantu efisiensi beban kerja rutin sehingga mereka dapat mengembangkan diri.", "Menunda proses digitalisasi sistem hingga seluruh staf mengikuti pelatihan teknis secara mandiri dan menyatakan kesiapan mereka untuk menggunakan perangkat baru.", "Mengalihkan tugas staf yang belum mahir teknologi ke bagian pemeliharaan sarana fisik sekolah, sambil memberikan program peningkatan kompetensi digital bertahap.", "Menjelaskan secara transparan mengenai tantangan masa depan dan membentuk tim kecil staf sebagai percontohan pengguna teknologi terlebih dahulu."], "a": 1, "e": "Mengajak staf berdialog tentang teknologi mengurangi beban kerja rutin sehingga mereka berkembang menunjukkan sikap terbuka, mendengar, dan memuliakan potensi.", "w": ["Jaminan tertulis menenangkan, tetapi masalah utamanya tidak dibahas terbuka.", null, "Menunda digitalisasi hingga semua siap menghambat kemajuan.", "Mengalihkan staf ke pemeliharaan sarana berpotensi merendahkan martabat mereka.", "Menjelaskan tantangan dan tim percontohan memilah staf."]}, {"cat": "Sosial", "q": "Seorang guru berprestasi di sekolah Anda mengalami penurunan performa akibat masalah keluarga yang cukup berat, sehingga interaksinya dengan siswa menjadi kurang hangat dan cenderung reaktif. Anda ingin membantu guru tersebut dengan tetap menjunjung tinggi etika profesional, kemitraan, dan kenyamanan psikologisnya sebagai bagian dari budaya memuliakan. Tindakan kepemimpinan humanis mana yang paling menunjukkan kematangan emosional dan kepedulian sosial Anda?", "opts": ["Mengajak guru tersebut berdiskusi dari hati ke hati untuk mendengarkan perspektifnya serta menawarkan kemitraan kolaboratif dalam mengelola tugasnya.", "Meringankan beban administrasi guru tersebut secara sementara dan memfasilitasi akses konseling bagi yang bersangkutan.", "Mengadakan rapat evaluasi kinerja guru secara umum yang juga membahas sistem dukungan kesejahteraan emosional bagi seluruh staf.", "Menyarankan guru tersebut untuk mengambil cuti panjang tetapi dengan jaminan kepastian tugas dan pendampingan psikologis dari sekolah.", "Memberikan teguran lisan secara tertutup yang disertai tawaran dukungan konkret dari sekolah untuk masalah keluarganya."], "a": 0, "e": "Diskusi dari hati ke hati untuk mendengar perspektif guru dan menawarkan kemitraan kolaboratif menunjukkan kematangan emosional dan kepedulian sosial, tanpa menghakimi.", "w": [null, "Meringankan beban dan konseling membantu, tetapi tidak dimulai dari mendengarkan.", "Rapat evaluasi umum tidak menyentuh kebutuhan guru secara personal.", "Menyarankan cuti panjang berisiko menyingkirkan guru.", "Teguran lisan menempatkan guru sebagai pihak bersalah."]}, {"cat": "Sosial", "q": "Sekolah Anda berencana mengembangkan kurikulum etnomatematika yang menghubungkan konsep geometri dengan motif batik lokal, namun beberapa tokoh masyarakat setempat khawatir nilai-nilai sakral budaya mereka akan terdistorsi jika dijadikan bahan pelajaran sekolah. Sebagai kepala sekolah, Anda harus mampu menjembatani perbedaan perspektif antara kepentingan akademik dan pelestarian nilai kearifan lokal. Bagaimana cara Anda mengelola hubungan sekolah dan masyarakat agar proyek lintas disiplin ini dapat diterima dengan baik?", "opts": ["Menjelaskan secara teknis kepada tokoh masyarakat bahwa motif batik hanya digunakan sebagai ilustrasi soal, dan mengundang mereka sebagai narasumber dalam pembelajaran.", "Melibatkan para pengrajin dan tokoh budaya lokal sebagai mitra pembelajaran untuk memastikan nilai spiritual tetap terjaga dan tersampaikan secara otentik.", "Mengubah rencana kurikulum dengan menggunakan motif batik dari daerah lain yang lebih netral, namun tetap mengundang tokoh setempat sebagai konsultan kehormatan.", "Menunjukkan data penelitian tentang keberhasilan integrasi budaya di sekolah lain, lalu memfasilitasi diskusi bersama tokoh untuk mengadaptasi model tersebut secara lokal.", "Memberikan kebebasan penuh kepada guru seni untuk menentukan sejauh mana nilai budaya diintegrasikan, dengan syarat melibatkan tokoh budaya dalam setiap tahap pengembangan materi."], "a": 1, "e": "Melibatkan pengrajin dan tokoh budaya sebagai mitra pembelajaran menjaga nilai spiritual tetap otentik dan menghormati kearifan lokal.", "w": ["Menjelaskan motif hanya ilustrasi sepihak dan menepis kekhawatiran.", null, "Mengganti motif dengan daerah lain menghindari isu dan meninggalkan tujuan kurikulum.", "Data penelitian sekolah lain kurang mendengar kekhawatiran lokal.", "Kebebasan guru seni membuat pelibatan tokoh sekadar formalitas."]}, {"cat": "Sosial", "q": "Dalam pelaksanaan Pembelajaran Berkesadaran, Anda mendapati bahwa sebagian guru merasa kesulitan mengelola waktu belajar di kelas karena aktivitas refleksi dan dialog metakognitif siswa memakan waktu yang lama, sehingga target materi buku teks tidak tuntas. Sebagai pemimpin yang bertanggung jawab terhadap mutu pendidikan, bagaimana keputusan strategis Anda untuk menyelaraskan kedalaman pemahaman dengan target kurikulum?", "opts": ["Meminta guru melakukan efisiensi pada tahap refleksi dengan memilih satu pertanyaan metakognitif paling esensial setiap pertemuan.", "Memberikan tambahan jam pelajaran di sore hari khusus untuk aktivitas refleksi sebagai ruang eksperimen tanpa tekanan target kurikulum.", "Mendorong guru melakukan identifikasi materi pelajaran guna membedakan pengetahuan esensial pembelajaran mendalam dan pengetahuan umum.", "Menginstruksikan penggunaan teknologi kuis instan di awal kelas sebagai pemanasan sebelum refleksi mendalam, bukan pengganti dialog.", "Menugaskan wakil kepala sekolah bidang kurikulum untuk menyusun uji coba ujian mandiri yang juga mengukur kemampuan refleksi siswa, bukan hanya hafalan."], "a": 2, "e": "Mengidentifikasi materi untuk membedakan pengetahuan esensial dan umum menyelaraskan kedalaman pemahaman dengan target kurikulum tanpa mengorbankan refleksi.", "w": ["Memangkas refleksi menjadi satu pertanyaan mengurangi kedalaman belajar.", "Refleksi sore hari memisahkan refleksi dari pembelajaran dan membebani siswa.", null, "Kuis instan tidak menyelesaikan masalah kepadatan materi.", "Uji coba ujian mandiri tidak menyentuh persoalan waktu di kelas."]}, {"cat": "Sosial", "q": "Anda ingin membangun budaya belajar di mana siswa memiliki keberanian untuk mengambil risiko intelektual (*risk-taking*) dan berinovasi, namun lingkungan sekolah saat ini masih cenderung menghukum kesalahan kecil secara administratif. Anda menyadari bahwa transformasi budaya membutuhkan keteladanan nyata dari pimpinan dalam menciptakan lingkungan yang aman bagi kreativitas. Langkah konkret apa yang paling tepat Anda lakukan untuk memulai perubahan budaya tersebut?", "opts": ["Membuat kotak saran digital di mana siswa dapat melaporkan tindakan guru yang dianggap terlalu kaku, dan secara rutin membahasnya sebagai bahan refleksi bersama.", "Merancang sistem penghargaan bagi siswa yang memiliki nilai rapor tertinggi sekaligus penghargaan untuk \"riset terbaik dari kegagalan\".", "Menyusun peraturan akademik baru yang lebih longgar terkait sanksi keterlambatan tugas, dan melatih guru memberikan umpan balik yang membangun tanpa rasa takut.", "Memberikan ruang bagi guru dan siswa mempresentasikan kegagalan proyek mereka sebagai sarana pembelajaran dan refleksi bersama.", "Mengundang motivator pendidikan untuk memberikan ceramah mengenai kreativitas dan menindaklanjutinya dengan sesi desain proyek kolaboratif lintas kelas."], "a": 3, "e": "Presentasi kegagalan proyek oleh guru dan siswa sebagai pembelajaran menormalkan risiko, keteladanan nyata untuk lingkungan yang aman berkreasi.", "w": ["Kotak saran digital berfokus pada pelaporan guru kaku.", "Penghargaan nilai tertinggi bersama riset dari kegagalan masih berorientasi kompetisi.", "Melonggarkan sanksi terlambat bersifat regulasi, bukan perubahan budaya.", null, "Ceramah motivator berdampak sesaat."]}, {"cat": "Sosial", "q": "Hasil asesmen menunjukkan adanya kesenjangan yang lebar antara pemahaman konseptual siswa dari keluarga mampu dan siswa dari latar belakang ekonomi rendah dalam proyek keberlanjutan yang membutuhkan banyak sumber daya. Sebagai pemimpin, Anda dituntut mewujudkan ekosistem pendidikan yang inklusif dan memuliakan setiap potensi tanpa memandang latar belakang sosial ekonomi. Bagaimana solusi kepemimpinan Anda untuk menjamin terjadinya diferensiasi pembelajaran yang adil bagi seluruh siswa?", "opts": ["Memberikan tugas mandiri berbeda bagi siswa kurang mampu yang tidak memerlukan biaya tambahan, dan menghubungkan mereka dengan sumber belajar komunitas.", "Menyarankan siswa dari keluarga mampu untuk membantu rekan-rekannya yang kesulitan secara materiil dalam kerangka proyek kolaborasi setara, bukan sedekah.", "Mengurangi tingkat kompleksitas proyek bagi seluruh kelas agar sumber daya yang dibutuhkan lebih sederhana, namun menyediakan jalur pendalaman bagi siswa yang mampu.", "Meminta komite sekolah untuk menggalang dana sukarela dari orang tua yang mampu, dan membentuk tim guru untuk mendampingi pemanfaatan dana secara transparan.", "Mengalokasikan dana operasional sekolah untuk mendukung penyediaan sumber belajar yang setara dan membimbing guru merancang aktivitas kolaboratif inklusif."], "a": 4, "e": "Mengalokasikan dana operasional untuk sumber belajar setara dan membimbing guru merancang aktivitas kolaboratif inklusif memastikan diferensiasi yang adil tanpa membebani siswa kurang mampu.", "w": ["Tugas berbeda tanpa biaya berisiko memisahkan siswa dan menurunkan tantangan.", "Mengandalkan bantuan siswa mampu menimbulkan ketergantungan.", "Mengurangi kompleksitas proyek menurunkan kualitas seluruh kelas.", "Dana sukarela orang tua mampu tidak menjamin keadilan.", null]}, {"cat": "Sosial", "q": "Di tengah tekanan kebijakan peningkatan nilai rata-rata ujian, Anda mendapati seorang guru memanipulasi data hasil formatif siswa agar terlihat melampaui kriteria kesuksesan yang telah ditetapkan. Sebagai kepala sekolah yang menjunjung tinggi integritas kepribadian dan kejujuran akademik sesuai nilai Pembelajaran Mendalam, Anda menghadapi dilema antara citra sekolah dan moralitas profesi. Respon kepemimpinan manakah yang paling mencerminkan konsistensi moral dan etika jabatan Anda?", "opts": ["Menganulir hasil data tersebut dan memfasilitasi diskusi reflektif bersama seluruh guru mengenai makna kejujuran sebagai bagian dari olah hati pendidik.", "Memberikan pembinaan tertutup kepada guru tersebut untuk memperbaiki datanya, dan menjadikan kasus ini sebagai bahan pelajaran etika profesi tanpa penghakiman publik.", "Mengabaikan temuan tersebut untuk sementara waktu hingga ujian akhir selesai, kemudian melakukan evaluasi menyeluruh terhadap sistem penilaian semester depan.", "Melaporkan tindakan guru tersebut secara resmi kepada pengawas sekolah, namun disertai rekomendasi pembinaan bukan hukuman administratif.", "Memperketat prosedur verifikasi nilai di tingkat wakil kepala sekolah, dan secara berkala mengadakan sesi refleksi integritas akademik bagi seluruh guru."], "a": 0, "e": "Menganulir data dan memfasilitasi diskusi reflektif tentang kejujuran menegakkan integritas sekaligus mendidik lewat olah hati.", "w": [null, "Pembinaan tertutup tanpa penganuliran data membiarkan data salah.", "Mengabaikan temuan sampai ujian selesai adalah pembiaran.", "Melapor ke pengawas tanpa penganuliran data belum memperbaiki masalah.", "Memperketat verifikasi hanya pencegahan ke depan."]}, {"cat": "Sosial", "q": "Sekolah Anda sedang merintis kemitraan dengan dunia industri untuk memberikan pengalaman belajar nyata bagi siswa, namun pihak industri menuntut standar disiplin dan kecepatan kerja sangat tinggi yang membuat siswa tertekan. Anda ingin kemitraan ini tetap berlanjut namun tetap menjaga well-being siswa sebagai subjek belajar yang aktif, gembira, dan mandiri. Bagaimana langkah mediasi sosial yang paling tepat Anda lakukan sebagai kepala sekolah?", "opts": ["Meminta pihak industri menurunkan standar kerja mereka khusus bagi siswa magang, dan bersama-sama menyusun indikator keberhasilan adaptif.", "Memberikan pembekalan ketangguhan mental kepada siswa sebelum terjun ke industri, disertai pendampingan rutin dari guru selama masa magang.", "Berdialog dengan mitra industri untuk merancang kurikulum pendampingan yang mengutamakan bimbingan (scaffolding) daripada sekadar tuntutan hasil kerja instan.", "Menarik seluruh siswa dari program magang tersebut dan mencari mitra industri lain yang memiliki budaya kerja lebih sesuai dengan prinsip pembelajaran mendalam.", "Menjelaskan kepada siswa bahwa tekanan kerja adalah realitas yang harus dihadapi, namun sekolah menyediakan ruang refleksi rutin untuk mengelola stres mereka."], "a": 2, "e": "Berdialog dengan mitra industri merancang kurikulum pendampingan yang mengutamakan scaffolding menjaga kemitraan tetap berlanjut dan well-being siswa terlindungi.", "w": ["Meminta industri menurunkan standar terlalu sepihak.", "Pembekalan ketangguhan mental menempatkan beban pada siswa.", null, "Menarik seluruh siswa memutus kemitraan.", "Menerima tekanan sebagai realitas mengabaikan penyebabnya."]}, {"cat": "Sosial", "q": "Anda memperhatikan bahwa komunikasi dalam tim pengembang kurikulum sekolah seringkali didominasi oleh perdebatan teknis administratif dan sangat jarang menyentuh aspek \"olah rasa\" atau empati terhadap beban belajar siswa. Sebagai pemimpin yang ingin mewujudkan pendidikan holistik, bermakna, dan berkesadaran, Anda ingin mengubah pola komunikasi tim tersebut. Sikap kepribadian manakah yang paling efektif Anda tunjukkan untuk memicu transformasi komunikasi tim tersebut?", "opts": ["Mengambil alih kepemimpinan rapat secara langsung dan menetapkan agenda yang secara eksplisit membahas metode penanaman nilai empati di setiap mata pelajaran.", "Mewajibkan setiap anggota tim mengikuti pelatihan komunikasi asertif dan manajemen konflik, serta menindaklanjutinya dengan praktik rutin di setiap rapat.", "Menyediakan ruang virtual khusus bagi tim kurikulum untuk mengunggah referensi teoretis mengenai pendidikan karakter dari berbagai pakar pendidikan dunia.", "Menetapkan aturan rapat baru bahwa setiap agenda teknis harus diawali dengan refleksi bersama mengenai dampaknya terhadap kesejahteraan siswa.", "Memberikan contoh nyata dengan rutin membagikan refleksi pribadi mengenai pengalaman Anda saat berinteraksi sosial dengan siswa yang memiliki hambatan belajar."], "a": 4, "e": "Teladan nyata dengan rutin membagikan refleksi pribadi tentang interaksi dengan siswa berhambatan belajar membuka kebiasaan berempati; pemimpin menunjukkan olah rasa lebih dulu.", "w": ["Mengambil alih rapat bersifat top-down.", "Mewajibkan pelatihan komunikasi asertif bersifat teknis dan perintah.", "Ruang virtual untuk referensi teoretis tidak menyentuh olah rasa.", "Aturan refleksi sebelum agenda bersifat prosedural, bukan teladan pemimpin.", null]}, {"cat": "Sosial", "q": "Beban kerja kepala sekolah dalam mengimplementasikan Pembelajaran Mendalam sangat tinggi, sehingga Anda mulai merasa kelelahan emosional dan kehilangan fokus saat memimpin koordinasi harian. Anda menyadari bahwa stabilitas emosi pemimpin sangat berpengaruh pada iklim sekolah yang kondusif bagi pertumbuhan fitrah seluruh warga sekolah. Keputusan manajemen diri manakah yang paling bijaksana dan memberikan keteladanan profesional bagi staf Anda?", "opts": ["Mendelegasikan seluruh tugas pengambilan keputusan penting kepada para wakil kepala sekolah sementara waktu, dengan tetap memantau dari jarak jauh.", "Tetap memaksakan diri bekerja optimal di sekolah guna menunjukkan dedikasi dan komitmen tinggi sebagai pemimpin yang pantang menyerah.", "Menunda seluruh agenda perubahan kurikulum hingga tahun ajaran depan ketika kondisi energi Anda dan para guru sudah kembali stabil.", "Mempraktikkan strategi regulasi diri seperti teknik pernapasan atau refleksi spiritual di sela kesibukan untuk menjaga kehadiran penuh (presence) saat berinteraksi.", "Mengonsumsi suplemen kesehatan secara rutin dan menambah jam olahraga di malam hari agar stamina tetap terjaga meskipun tekanan pekerjaan sangat berat."], "a": 3, "e": "Praktik regulasi diri seperti pernapasan atau refleksi spiritual menjaga kehadiran penuh dan menjadi teladan manajemen diri sehat bagi staf.", "w": ["Mendelegasikan seluruh keputusan penting menghindari tanggung jawab.", "Memaksakan diri bekerja optimal merusak kualitas kepemimpinan.", "Menunda agenda kurikulum menghentikan perubahan.", null, "Suplemen dan olahraga malam hanya fisik dan tidak menyentuh regulasi emosi."]}, {"cat": "Sosial", "q": "Dalam upaya meningkatkan kepedulian sosial siswa terhadap permasalahan masyarakat (dimensi kewargaan), Anda merancang program \"Sekolah Membangun Desa\", namun beberapa warga desa meragukan kemampuan siswa kota. Sebagai jembatan antara sekolah dan masyarakat, Anda harus mampu menunjukkan nilai kolaborasi inkuiri yang saling menghargai martabat manusia. Bagaimana cara Anda membangun kepercayaan sosial dengan warga desa tersebut?", "opts": ["Menunjukkan profil lulusan sekolah yang memiliki nalar kritis dan kreativitas tinggi melalui presentasi data prestasi akademik siswa di depan perangkat desa.", "Membimbing siswa melakukan observasi dengan rendah hati, mendengarkan perspektif petani, dan berkolaborasi merancang solusi berbasis kearifan lokal desa.", "Memberikan jaminan bahwa siswa akan membawa bantuan modal dan teknologi canggih dari kota untuk menyelesaikan masalah pertanian di desa secara instan.", "Menginstruksikan siswa membawa banyak dokumentasi video agar kegiatan ini dapat dipublikasikan di media sosial guna menarik dukungan publik dan dana bantuan.", "Meminta para guru untuk mendominasi proses pengambilan keputusan dalam proyek desa tersebut agar tidak terjadi kesalahan teknis yang dilakukan siswa."], "a": 1, "e": "Observasi dengan rendah hati, mendengar petani, dan merancang solusi berbasis kearifan lokal membangun kepercayaan lewat sikap saling menghargai.", "w": ["Memamerkan prestasi akademik menunjukkan keunggulan, bukan kerendahan hati.", null, "Menjanjikan bantuan modal dan teknologi instan tidak realistis dan merendahkan warga.", "Dokumentasi video untuk publikasi menjadikan warga objek.", "Guru mendominasi keputusan menghilangkan peran siswa dan warga."]}];

let cfg={mode:"latihan",cats:new Set(CATS),count:0,rq:true,ro:true,dur:0};
let S=null,tmr=null;
const store={get(){try{return JSON.parse(localStorage.getItem("hist")||"[]")}catch(e){return[]}},add(x){try{const h=store.get();h.unshift(x);localStorage.setItem("hist",JSON.stringify(h.slice(0,5)))}catch(e){}}};
// tema
const root=document.documentElement;
try{root.dataset.t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){}
$("#th").onclick=()=>{root.dataset.t=root.dataset.t==="dark"?"light":"dark";try{localStorage.setItem("theme",root.dataset.t)}catch(e){}};

const KODE="hasbullah1979";
let user=null;
try{const u=sessionStorage.getItem("user");if(u)user=JSON.parse(u)}catch(e){}
function setUser(u){user=u;try{u?sessionStorage.setItem("user",JSON.stringify(u)):sessionStorage.removeItem("user")}catch(e){}}
$("#lo").onclick=()=>{clearInterval(tmr);S=null;setUser(null);login()};
function login(){
  clearInterval(tmr);S=null;$("#lo").style.display="none";
  app.innerHTML=`<div class="card lg"><h2>Login 🔐</h2><p class="sub">Masuk untuk memulai latihan soal.</p>
  <label for="nm">Nama</label><input type="text" id="nm" placeholder="Masukkan nama Anda" autocomplete="name">
  <label for="kd">Kode Akses</label><input type="password" id="kd" placeholder="Masukkan kode akses" autocomplete="off">
  <div class="err" id="er"></div>
  <button class="btn big" id="ok" style="margin-top:8px">Masuk →</button>
  <div class="note">Untuk mendapatkan kode akses, silahkan hubungi <b>Bapak Hasbullah Jaini</b>, donasi seiklasnya ke Rek BRI : 0282 0105 0904 509. Bila ingin uji coba aplikasi, silahkan klik <a id="tr">DISINI</a>, uji coba hanya menampilkan 4 soal latihan.</div></div>`;
  const go=()=>{const n=$("#nm").value.trim(),k=$("#kd").value.trim();
    if(!n){$("#er").textContent="Nama wajib diisi.";$("#nm").focus();return}
    if(k.toLowerCase()!==KODE){$("#er").textContent="Kode akses salah. Silahkan hubungi Bapak Hasbullah Jaini.";$("#kd").focus();return}
    setUser({name:n,trial:false});home()};
  $("#ok").onclick=go;
  app.querySelectorAll("input").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")go()}));
  $("#tr").onclick=()=>{setUser({name:$("#nm").value.trim()||"Tamu",trial:true});home()};
}
function home(){
  if(!user)return login();
  clearInterval(tmr);S=null;$("#lo").style.display="";
  const tr=user.trial;
  const total=tr?4:DATA.filter(d=>cfg.cats.has(d.cat)).length;
  const h=tr?[]:store.get();
  const mode=tr?"latihan":cfg.mode, D=tr?"dis":"";
  app.innerHTML=`<div class="card">
  <h2>Selamat datang, ${esc(user.name)} 👋${tr?'<span class="badge">UJI COBA</span>':""}</h2><p class="sub">${tr?"Mode uji coba: hanya 4 soal latihan (1 per kompetensi). Pengaturan dinonaktifkan.":"Atur sesi belajar Anda, lalu tekan Mulai."}</p>
  <div class="lbl">Mode</div>
  <div class="modes">
   <button class="mode ${mode==="latihan"?"on":""}" data-m="latihan"><b>📘 Mode Latihan</b><span>Langsung tahu benar/salah + pembahasan di setiap soal.</span></button>
   <button class="mode ${mode==="ujian"?"on":""} ${D}" data-m="ujian" ${tr?"disabled":""}><b>📝 Mode Ujian</b><span>Tanpa notifikasi. Nilai muncul setelah semua selesai.</span></button>
  </div>
  <div class="lbl">Kompetensi (${total} soal tersedia)</div>
  <div class="chips ${D}">${CATS.map(c=>`<div class="chip ${tr||cfg.cats.has(c)?"on":""}" data-c="${c}">${c} (${tr?1:DATA.filter(d=>d.cat===c).length})</div>`).join("")}</div>
  <div class="lbl">Pengaturan</div>
  <div class="${D}">
  <div class="row"><div><b>Acak urutan soal</b></div><label class="sw"><input type="checkbox" id="rq" ${!tr&&cfg.rq?"checked":""} ${tr?"disabled":""}><i></i></label></div>
  <div class="row"><div><b>Acak urutan pilihan jawaban</b></div><label class="sw"><input type="checkbox" id="ro" ${!tr&&cfg.ro?"checked":""} ${tr?"disabled":""}><i></i></label></div>
  <div class="row"><div><b>Jumlah soal</b><br><small style="color:var(--mut)">0 = semua soal terpilih</small></div><input type="number" id="cnt" min="0" max="${total}" value="${tr?0:cfg.count}" ${tr?"disabled":""}></div>
  <div class="row" ${mode==="ujian"?"":'style="display:none"'}><div><b>Durasi ujian (menit)</b><br><small style="color:var(--mut)">0 = tanpa batas waktu</small></div><input type="number" id="dur" min="0" value="${cfg.dur}"></div>
  </div>
  <button class="btn big" id="go" ${total?"":"disabled"}>Mulai ${mode==="ujian"?"Ujian":"Latihan"} →</button>
  ${h.length?`<div class="hist"><b>Riwayat terakhir:</b><br>${h.map(x=>`${x.d} • ${x.m} • ${x.n} soal • nilai <b>${x.s}</b>`).join("<br>")}</div>`:""}
  </div>`;
  if(!tr){
    app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{sync();cfg.mode=b.dataset.m;home()});
    app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{sync();const k=c.dataset.c;cfg.cats.has(k)?cfg.cats.delete(k):cfg.cats.add(k);home()});
  }
  function sync(){if(tr)return;cfg.rq=$("#rq").checked;cfg.ro=$("#ro").checked;cfg.count=+$("#cnt").value||0;const d=$("#dur");if(d)cfg.dur=+d.value||0}
  $("#go").onclick=()=>{sync();start()};
}
function start(){
  const tr=user&&user.trial;
  let pool;
  if(tr){pool=CATS.map(c=>{const a=DATA.filter(d=>d.cat===c);return a[Math.random()*a.length|0]})}
  else{pool=DATA.filter(d=>cfg.cats.has(d.cat));if(cfg.rq)pool=shuf(pool);if(cfg.count>0)pool=pool.slice(0,cfg.count)}
  const mode=tr?"latihan":cfg.mode,ro=!tr&&cfg.ro;
  const items=pool.map(d=>{let o=d.opts.map((t,i)=>({t,ok:i===d.a,w:d.w[i]}));if(ro)o=shuf(o);return{cat:d.cat,q:d.q,e:d.e,o}});
  S={mode,items,i:0,ans:[],flag:{},left:mode==="ujian"&&cfg.dur>0?cfg.dur*60:null,t0:Date.now()};
  if(S.left!==null){tmr=setInterval(()=>{S.left--;const t=$("#tm");if(t)t.textContent=fmt(S.left);if(S.left<=0){clearInterval(tmr);finish()}},1000)}
  quiz();
}
const fmt=s=>`⏱ ${String(s/60|0).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
const others=(it,skip)=>it.o.map((o,j)=>o.ok||j===skip?"":`<p style="margin:4px 0"><b>${L[j]}.</b> ${esc(o.w)}</p>`).join("");
const correctIdx=it=>it.o.findIndex(x=>x.ok);
function quiz(){
  const it=S.items[S.i],n=S.items.length,a=S.ans[S.i],ex=S.mode==="ujian",done=a!==undefined;
  const opts=it.o.map((o,j)=>{
    let c="";
    if(!ex&&done){c=o.ok?"ok":(j===a?"no":"")}else if(ex&&a===j)c="sel";
    return`<button class="opt ${c}" data-j="${j}" ${!ex&&done?"disabled":""}><span class="l">${L[j]}</span><span>${esc(o.t)}</span></button>`}).join("");
  let fb="";
  if(!ex&&done){const ok=it.o[a].ok;fb=`<div class="fb ${ok?"ok":"no"}"><h4>${ok?"✅ Benar! Jawaban Anda tepat.":"❌ Kurang tepat."}</h4><p><b>Jawaban benar: ${L[correctIdx(it)]}.</b> ${esc(it.o[correctIdx(it)].t)}</p><p><b>Pembahasan:</b> ${esc(it.e)}</p>${!ok?`<p><b>Mengapa pilihan Anda (${L[a]}) kurang tepat:</b> ${esc(it.o[a].w)}</p>`:""}<details style="margin-top:6px"><summary style="cursor:pointer;font-weight:700">Alasan opsi lainnya</summary>${others(it,a)}</details></div>`}
  const grid=ex?`<div class="grid">${S.items.map((_,k)=>`<button class="gn ${S.ans[k]!==undefined?"a":""} ${k===S.i?"c":""}" data-k="${k}">${k+1}</button>`).join("")}</div>`:"";
  app.innerHTML=`<div class="card">
   <div class="top"><span class="tag">${it.cat}</span><span class="tag">Soal ${S.i+1}/${n}</span>${S.left!==null?`<span class="tm" id="tm">${fmt(S.left)}</span>`:""}</div>
   <div class="bar"><div style="width:${(S.i+(done?1:0))/n*100}%"></div></div>
   <p class="q">${esc(it.q)}</p>${opts}${fb}
   <div class="nav"><button class="btn g" id="pv" ${S.i?"":"disabled"}>← Sebelumnya</button>
   ${ex?`<button class="btn g" id="fl">${S.flag[S.i]?"⚑ Batal tandai":"⚐ Tandai ragu"}</button>`:""}
   ${S.i<n-1?`<button class="btn" id="nx" ${!ex&&!done?"disabled":""}>Lanjut →</button>`:`<button class="btn" id="fn" ${!ex&&!done?"disabled":""}>Selesai ✓</button>`}</div>
   ${grid}
   <div style="margin-top:14px;text-align:center"><button class="btn g" id="qt" style="padding:8px 14px;font-size:.85rem">Keluar</button></div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(!ex&&done)return;S.ans[S.i]=+b.dataset.j;quiz()});
  $("#pv").onclick=()=>{S.i--;quiz()};
  const nx=$("#nx");if(nx)nx.onclick=()=>{S.i++;quiz()};
  const fn=$("#fn");if(fn)fn.onclick=confirmFinish;
  const fl=$("#fl");if(fl)fl.onclick=()=>{S.flag[S.i]=!S.flag[S.i];quiz()};
  app.querySelectorAll(".gn").forEach(b=>{b.onclick=()=>{S.i=+b.dataset.k;quiz()};if(S.flag[b.dataset.k])b.textContent+="⚑"});
  $("#qt").onclick=()=>modal("Keluar dari sesi?","Progres sesi ini akan hilang.","Ya, keluar",()=>home());
  if(ex&&S.i===n-1||ex)addFinish();
  function addFinish(){if(!ex)return;const d=document.createElement("button");d.className="btn big";d.textContent="Selesaikan Ujian & Lihat Nilai";d.onclick=confirmFinish;app.firstElementChild.insertBefore(d,app.querySelector(".grid").nextSibling)}
}
function modal(t,m,yes,fn){
  const d=document.createElement("div");d.className="modal";
  d.innerHTML=`<div class="card"><h2>${t}</h2><p class="sub">${m}</p><div style="display:flex;gap:10px;justify-content:center"><button class="btn g" id="mn">Batal</button><button class="btn" id="my">${yes}</button></div></div>`;
  document.body.appendChild(d);$("#mn").onclick=()=>d.remove();$("#my").onclick=()=>{d.remove();fn()};
}
function confirmFinish(){
  const un=S.items.length-S.ans.filter(x=>x!==undefined).length;
  modal("Selesaikan sesi?",un?`Masih ada <b>${un}</b> soal belum dijawab.`:"Semua soal sudah dijawab.","Ya, selesai",finish);
}
function finish(){
  clearInterval(tmr);
  const n=S.items.length;let ok=0;const per={};
  S.items.forEach((it,k)=>{const p=per[it.cat]=per[it.cat]||{b:0,n:0};p.n++;if(S.ans[k]!==undefined&&it.o[S.ans[k]].ok){ok++;p.b++}});
  const un=S.items.filter((_,k)=>S.ans[k]===undefined).length, sc=Math.round(ok/n*100);
  if(!(user&&user.trial))store.add({d:new Date().toLocaleDateString("id-ID"),m:S.mode==="ujian"?"Ujian":"Latihan",n,s:sc});
  const msg=sc>=80?"Luar biasa! 🎉":sc>=60?"Bagus, terus tingkatkan! 💪":"Ayo berlatih lagi, Anda pasti bisa! 📚";
  S.res={ok,un,sc};
  app.innerHTML=`<div class="card" style="text-align:center"><h2>Hasil ${S.mode==="ujian"?"Ujian":"Latihan"}</h2><p class="sub">${msg}</p>
  <div class="ring"><svg width="170" height="170" viewBox="0 0 170 170"><defs><linearGradient id="gr"><stop offset="0" stop-color="#5b5bf0"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><circle class="bg" cx="85" cy="85" r="70"/><circle class="fg" id="fg" cx="85" cy="85" r="70"/></svg><b id="scv">0</b></div>
  <div class="stats"><div class="st"><b style="color:var(--ok)">${ok}</b><span>Benar</span></div><div class="st"><b style="color:var(--no)">${n-ok-un}</b><span>Salah</span></div><div class="st"><b>${un}</b><span>Kosong</span></div></div>
  <div style="text-align:left">${Object.keys(per).map(c=>`<div class="cb"><div class="h"><b>${c}</b><span>${per[c].b}/${per[c].n}</span></div><div class="bar"><div style="width:${per[c].b/per[c].n*100}%"></div></div></div>`).join("")}</div>
  <div class="nav" style="justify-content:center"><button class="btn" id="rv">🔍 Lihat Pembahasan</button><button class="btn g" id="hm">Menu Utama</button></div></div>`;
  requestAnimationFrame(()=>setTimeout(()=>{$("#fg").style.strokeDashoffset=440*(1-sc/100)},60));
  let v=0;const iv=setInterval(()=>{v=Math.min(sc,v+Math.ceil(sc/40)||1);$("#scv").textContent=v;if(v>=sc)clearInterval(iv)},30);
  $("#rv").onclick=()=>review("semua");$("#hm").onclick=home;
}
function review(f){
  const rows=S.items.map((it,k)=>{
    const a=S.ans[k],st=a===undefined?"kosong":it.o[a].ok?"benar":"salah";
    if(f!=="semua"&&f!==st)return"";
    return`<div class="rv"><div class="top"><span class="tag">${it.cat}</span><span class="tag">Soal ${k+1}</span><span class="tag" style="background:${st==="benar"?"var(--okbg)":"var(--nobg)"};color:${st==="benar"?"var(--ok)":"var(--no)"}">${st.toUpperCase()}</span></div>
    <p class="q" style="font-size:.98rem">${esc(it.q)}</p>
    ${it.o.map((o,j)=>`<div class="opt ${o.ok?"ok":j===a?"no":""}"><span class="l">${L[j]}</span><span>${esc(o.t)}${j===a?" <i>(jawaban Anda)</i>":""}${o.ok?" ✔":""}</span></div>`).join("")}
    <div class="fb ok"><p><b>Pembahasan:</b> Jawaban benar adalah <b>${L[correctIdx(it)]}</b>. ${esc(it.e)}</p>${a!==undefined&&!it.o[a].ok?`<p><b>Mengapa pilihan Anda (${L[a]}) kurang tepat:</b> ${esc(it.o[a].w)}</p>`:""}<details><summary style="cursor:pointer;font-weight:700">Alasan opsi lainnya</summary>${others(it,a===undefined?-1:a)}</details></div></div>`}).join("");
  app.innerHTML=`<div class="card"><h2>Pembahasan</h2><div class="chips" style="margin:12px 0">${["semua","benar","salah","kosong"].map(x=>`<div class="chip ${f===x?"on":""}" data-f="${x}">${x[0].toUpperCase()+x.slice(1)}</div>`).join("")}</div>${rows||'<p class="sub">Tidak ada soal pada kategori ini.</p>'}
  <div class="nav"><button class="btn g" id="bk">← Kembali ke Hasil</button><button class="btn" id="hm">Menu Utama</button></div></div>`;
  app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>review(c.dataset.f));
  $("#hm").onclick=home;$("#bk").onclick=finish;
}
document.addEventListener("keydown",e=>{
  if(!S||S.res||document.querySelector(".modal"))return;
  const k=e.key.toUpperCase(),ex=S.mode==="ujian";
  if(L.includes(k)&&k.length===1){const b=app.querySelectorAll(".opt")[L.indexOf(k)];if(b&&!b.disabled)b.click()}
  else if(e.key==="ArrowRight"){const b=$("#nx");if(b&&!b.disabled)b.click()}
  else if(e.key==="ArrowLeft"){const b=$("#pv");if(b&&!b.disabled)b.click()}
});
user?home():login();
</script>
</body>
</html>
